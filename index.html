<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>D0NTYYY — License Plates</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 20% 0%,rgba(80,90,110,.16),transparent 35%),
        radial-gradient(circle at 100% 100%,rgba(40,70,80,.12),transparent 40%),
        #080a0c;
    color:#eee;
}

body{overflow-x:hidden}

button,input,select{font:inherit}
button{cursor:pointer}

.hidden{display:none!important}

.muted{color:#777f87}

.glass{
    background:rgba(16,18,21,.78);
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    backdrop-filter:blur(18px);
}

/* AUTH */

.auth-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.auth-box{
    width:430px;
    max-width:100%;
    padding:30px;
    border-radius:22px;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{color:#666}

.auth-sub{
    color:#777;
    margin:7px 0 25px;
}

.field{margin-bottom:15px}

.field label{
    display:block;
    color:#777;
    font-size:11px;
    font-weight:900;
    margin-bottom:7px;
    text-transform:uppercase;
}

.field input,
.field select{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:1px solid #292d32;
    outline:none;
    background:#0d0f11;
    color:#eee;
}

.field input:focus,
.field select:focus{
    border-color:#555d66;
}

.auth-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn{
    border:1px solid #292d32;
    background:#15181b;
    color:#eee;
    padding:11px 16px;
    border-radius:10px;
    font-weight:800;
    transition:.15s;
}

.btn:hover{
    background:#1d2125;
    border-color:#41474d;
}

.btn.primary{
    background:#eee;
    color:#090a0b;
    border-color:#eee;
}

.btn.green{color:#66d59a}
.btn.danger{color:#ff6969}
.btn.gold{color:#e5bb52}

.auth-switch{
    margin-top:18px;
    text-align:center;
    color:#777;
}

/* APP */

.topbar{
    height:68px;
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    background:rgba(8,10,12,.86);
    border-bottom:1px solid rgba(255,255,255,.06);
    backdrop-filter:blur(18px);
}

.brand{
    font-size:19px;
    font-weight:900;
    letter-spacing:1.5px;
}

.brand small{
    color:#666;
    font-size:10px;
    margin-left:7px;
}

.top-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.balance{
    padding:8px 12px;
    border-radius:9px;
    background:#121518;
    color:#aaa;
    border:1px solid #25292d;
}

.layout{
    display:grid;
    grid-template-columns:230px 1fr;
    min-height:calc(100vh - 68px);
}

.sidebar{
    padding:18px 12px;
    border-right:1px solid rgba(255,255,255,.06);
    background:rgba(9,11,13,.6);
}

.nav-title{
    color:#555b62;
    font-size:10px;
    font-weight:900;
    margin:15px 10px 7px;
}

.nav-btn{
    width:100%;
    padding:11px 12px;
    text-align:left;
    color:#9a9fa5;
    background:transparent;
    border:1px solid transparent;
    border-radius:9px;
    margin-bottom:4px;
}

.nav-btn:hover,
.nav-btn.active{
    background:#15181b;
    color:#eee;
    border-color:#272c30;
}

.content{
    padding:28px;
    max-width:1250px;
    width:100%;
    margin:auto;
}

.page-title{
    font-size:25px;
    font-weight:900;
}

.page-sub{
    color:#656b72;
    margin:5px 0 25px;
}

/* SPINNER */

.spinner-card{
    border-radius:22px;
    padding:35px;
    text-align:center;
    margin-bottom:20px;
}

.plate-stage{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin:30px auto 35px;
}

.plate{
    width:340px;
    max-width:calc(100vw - 150px);
    height:105px;
    padding:10px 20px;
    background:#f1f1f1;
    color:#111;
    border-radius:8px;
    border:3px solid #aaa;
    box-shadow:
        0 15px 35px rgba(0,0,0,.4),
        inset 0 0 0 2px #ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    font-weight:900;
    letter-spacing:2px;
    position:relative;
}

.plate:after{
    content:"";
    position:absolute;
    right:6px;
    bottom:5px;
    width:27px;
    height:13px;
    background:
        linear-gradient(
            to bottom,
            #fff 0 33%,
            #3159bd 33% 66%,
            #d52e38 66%
        );
    border:1px solid #aaa;
}

.plate:before{
    content:"RUS";
    position:absolute;
    right:9px;
    bottom:20px;
    font-size:7px;
    font-weight:900;
    letter-spacing:0;
}

.region-box{
    width:105px;
    height:105px;
    flex-shrink:0;
    background:#f1f1f1;
    color:#111;
    border:3px solid #aaa;
    border-radius:8px;
    box-shadow:
        0 15px 35px rgba(0,0,0,.4),
        inset 0 0 0 2px #ddd;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.region-number{
    font-size:34px;
    font-weight:900;
    line-height:1;
}

.region-rus{
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    margin-top:6px;
}

.russia-flag{
    width:30px;
    height:17px;
    display:flex;
    flex-direction:column;
    margin-top:4px;
    border:1px solid #aaa;
}

.russia-flag i{flex:1}
.flag-white{background:#fff}
.flag-blue{background:#2858bd}
.flag-red{background:#d52e38}

.spin-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    max-width:700px;
    margin:auto;
}

.spin-btn{
    height:53px;
    border-radius:11px;
    border:1px solid #2a2f34;
    background:#111417;
    color:#ddd;
    font-weight:900;
}

.spin-btn:hover{
    background:#1a1e22;
}

.finish-btn{
    width:100%;
    max-width:700px;
    height:54px;
    margin-top:12px;
}

.spin-status{
    margin-top:15px;
    color:#656b72;
    font-size:12px;
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.card{
    background:rgba(16,18,21,.75);
    border:1px solid #202428;
    border-radius:16px;
    padding:20px;
}

.card-title{
    font-size:11px;
    color:#6c7278;
    text-transform:uppercase;
    font-weight:900;
    margin-bottom:8px;
}

.card-value{
    font-size:24px;
    font-weight:900;
}

/* INVENTORY / MARKET */

.plate-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.owned-plate{
    background:#111417;
    border:1px solid #24292e;
    padding:15px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.mini-code{
    font-size:20px;
    font-weight:900;
}

.mini-region{
    color:#777;
    font-size:11px;
    margin-top:5px;
}

.rarity{
    font-size:10px;
    text-transform:uppercase;
    font-weight:900;
    margin-top:5px;
}

.common{color:#aaa}
.rare{color:#b98cff}
.gold{color:#e7bc48}

/* TOP */

.top-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.top-row{
    display:grid;
    grid-template-columns:55px 1fr 180px;
    padding:14px 16px;
    border:1px solid #22272b;
    border-radius:11px;
    background:#111417;
    align-items:center;
}

.top-row.first{
    border-color:#c89b36;
    background:linear-gradient(90deg,rgba(201,156,48,.13),#111417);
}

.top-row.second{
    border-color:#8c9198;
    background:linear-gradient(90deg,rgba(170,175,185,.09),#111417);
}

.top-row.third{
    border-color:#9a633c;
    background:linear-gradient(90deg,rgba(154,99,60,.10),#111417);
}

/* PROMO */

.promo-box{
    display:flex;
    gap:10px;
}

.promo-box input{
    flex:1;
}

/* ADMIN */

.admin-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(10px);
}

.admin-window{
    width:1100px;
    max-width:100%;
    max-height:90vh;
    overflow:auto;
    background:#0c0f11;
    border:1px solid #292e33;
    border-radius:18px;
}

.admin-head{
    padding:20px;
    border-bottom:1px solid #22272b;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.admin-body{
    display:grid;
    grid-template-columns:210px 1fr;
    min-height:500px;
}

.admin-side{
    border-right:1px solid #22272b;
    padding:12px;
}

.admin-content{
    padding:25px;
}

.admin-nav{
    width:100%;
    padding:11px;
    background:transparent;
    border:0;
    color:#888;
    text-align:left;
    border-radius:8px;
    margin-bottom:3px;
}

.admin-nav:hover,
.admin-nav.active{
    background:#171a1d;
    color:#eee;
}

/* TABLE */

.table-wrap{overflow:auto}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    text-align:left;
    border-bottom:1px solid #22272b;
}

th{
    color:#666;
    font-size:11px;
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:300;
    background:#15181b;
    border:1px solid #30353a;
    color:#eee;
    padding:14px 18px;
    border-radius:10px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

/* MOBILE */

@media(max-width:800px){

    .topbar{
        padding:0 12px;
    }

    .brand{
        font-size:14px;
    }

    .top-user{
        font-size:12px;
    }

    .balance{
        display:none;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        display:flex;
        overflow:auto;
        gap:5px;
        border-right:0;
        border-bottom:1px solid #202428;
    }

    .nav-title{
        display:none;
    }

    .nav-btn{
        min-width:max-content;
        width:auto;
    }

    .content{
        padding:17px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .plate-stage{
        gap:6px;
    }

    .plate{
        width:calc(100% - 92px);
        height:75px;
        max-width:none;
        font-size:33px;
        padding:5px;
    }

    .region-box{
        width:85px;
        height:75px;
    }

    .region-number{
        font-size:25px;
    }

    .region-rus{
        font-size:8px;
        margin-top:3px;
    }

    .russia-flag{
        width:24px;
        height:13px;
    }

    .spin-buttons{
        grid-template-columns:1fr;
    }

    .plate-list{
        grid-template-columns:1fr;
    }

    .top-row{
        grid-template-columns:45px 1fr 120px;
    }

    .admin-body{
        grid-template-columns:1fr;
    }

    .admin-side{
        border-right:0;
        border-bottom:1px solid #22272b;
    }

    .promo-box{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div id="authView" class="auth-screen">

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://wehiexatkhqbfcelvjnr.supabase.co';

const SUPABASE_KEY =
'sb_publishable_JR5bFKt15zPnzAzeripx8w___vtFpW1';

const REST =
SUPABASE_URL + '/rest/v1/license_state';

const HEADERS = {
    apikey:SUPABASE_KEY,
    Authorization:'Bearer '+SUPABASE_KEY,
    'Content-Type':'application/json'
};


/* =========================================================
   STATE
========================================================= */

let state = {
    users:[],
    plates:[],
    market:[],
    tags:[],
    reports:[],
    messages:[],
    promocodes:[],
    punishments:[]
};

let currentUser = null;

let currentPage = 'home';

let syncBusy = false;

const OWNER = 'd0ntyyy';
const OWNER_PASSWORD = 'Semen20151';

const LETTERS = 'АВЕКМНОРСТУХ';

let spinState = {
    firstLetter:'?',
    numbers:'???',
    lastLetters:'??',
    region:'???',
    spunLetters:false,
    spunNumbers:false,
    spunRegion:false,
    created:false
};


/* =========================================================
   HELPERS
========================================================= */

function uid(){
    return Date.now().toString(36)+
           Math.random().toString(36).slice(2,9);
}

function esc(v){
    return String(v ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
}

function toast(message){

    const el=document.getElementById('toast');

    el.textContent=message;
    el.classList.remove('hidden');

    clearTimeout(window.__toast);

    window.__toast=setTimeout(()=>{
        el.classList.add('hidden');
    },2500);
}

function isOwner(user=currentUser){

    return !!user &&
        String(user.nickname).toLowerCase()===OWNER;
}

function refreshUser(){

    if(!currentUser)return;

    const fresh=state.users.find(
        u=>u.id===currentUser.id
    );

    if(fresh)
        currentUser=fresh;

    document.getElementById('userNameView').textContent=
        currentUser.nickname;

    document.getElementById('balanceView').textContent=
        Number(currentUser.balance||0)
        .toLocaleString('ru-RU')+' ₽';
}


/* =========================================================
   SUPABASE LOAD / SAVE
========================================================= */

async function cloudLoad(){

    try{

        const response=await fetch(
            REST+'?id=eq.1&select=id,state,updated_at',
            {headers:HEADERS}
        );

        if(!response.ok)
            throw new Error(await response.text());

        const rows=await response.json();

        if(rows[0]?.state){

            let remote=rows[0].state;

            if(typeof remote==='string')
                remote=JSON.parse(remote);

            state=normalize(remote);

        }else{

            state=normalize(state);
            await cloudSave();

        }

    }catch(error){

        console.error(error);

        toast('Ошибка подключения к базе данных');

    }

}


async function cloudSave(){

    try{

        state=normalize(state);

        const response=await fetch(
            REST+'?id=eq.1',
            {
                method:'PATCH',
                headers:{
                    ...HEADERS,
                    Prefer:'return=minimal'
                },
                body:JSON.stringify({
                    state:JSON.stringify(state),
                    updated_at:new Date().toISOString()
                })
            }
        );

        if(!response.ok)
            console.error(await response.text());

    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(data){

    data=data||{};

    [
        'users',
        'plates',
        'market',
        'tags',
        'reports',
        'messages',
        'promocodes',
        'punishments'
    ].forEach(key=>{

        if(!Array.isArray(data[key]))
            data[key]=[];

    });

    let owner=data.users.find(
        u=>String(u.nickname).toLowerCase()===OWNER
    );

    if(!owner){

        owner={
            id:uid(),
            nickname:OWNER,
            password:OWNER_PASSWORD,
            balance:10000000,
            admin:true,
            adminRole:'owner',
            banned:false,
            createdAt:new Date().toISOString()
        };

        data.users.push(owner);

    }else{

        owner.password=OWNER_PASSWORD;
        owner.admin=true;
        owner.adminRole='owner';

        if(Number(owner.balance||0)<10000000)
            owner.balance=10000000;

    }

    return data;
}


/* =========================================================
   AUTH
========================================================= */

function toggleRegister(){

    const register=
        document.getElementById('registerForm');

    const login=
        document.getElementById('authForm');

    const isHidden=
        register.classList.contains('hidden');

    register.classList.toggle('hidden',!isHidden);
    login.classList.toggle('hidden',isHidden);
}


async function register(){

    const nickname=
        document.getElementById('regNickname')
        .value.trim();

    const password=
        document.getElementById('regPassword')
        .value;

    if(nickname.length<3){

        toast('Никнейм минимум 3 символа');
        return;

    }

    if(password.length<4){

        toast('Пароль минимум 4 символа');
        return;

    }

    if(state.users.some(
        u=>String(u.nickname).toLowerCase()
        ===nickname.toLowerCase()
    )){

/* =========================================================
   SPINNER
========================================================= */

function randomLetter(){

    return LETTERS[
        Math.floor(Math.random()*LETTERS.length)
    ];

}

function randomDigits(){

    return String(
        Math.floor(Math.random()*1000)
    ).padStart(3,'0');

}

function rareDigits(){

    if(Math.random()<.6){

        const n=
            Math.floor(Math.random()*10);

        return `${n}${n}${n}`;

    }

    const a=
        Math.floor(Math.random()*10);

    const b=
        Math.floor(Math.random()*10);

    return `${a}${a}${b}`;

}

function randomLetterSet(){

    if(Math.random()<.15){

        const a=randomLetter();

        return {
            firstLetter:a,
            lastLetters:
                a+randomLetter()
        };

    }

    return {
        firstLetter:randomLetter(),
        lastLetters:
            randomLetter()+randomLetter()
    };

}

function randomRegion(){

    return String(
        Math.floor(Math.random()*1000)
    ).padStart(3,'0');

}

function getPlateCode(){

    return (
        spinState.firstLetter+
        spinState.numbers+
        spinState.lastLetters
    );

}

function getFullCode(){

    return getPlateCode()+
        ' | '+
        spinState.region;

}

function getRarity(){

    const letters=
        spinState.firstLetter+
        spinState.lastLetters;

    const numbers=
        spinState.numbers;

    if(
        numbers[0]===numbers[1] &&
        numbers[1]===numbers[2]
    )
        return 'gold';

    if(
        letters[0]===letters[1] &&
        letters[1]===letters[2]
    )
        return 'gold';

    if(
        numbers[0]===numbers[1] ||
        numbers[1]===numbers[2]
    )
        return 'rare';

    if(
        letters[0]===letters[1] ||
        letters[1]===letters[2]
    )
        return 'rare';

    return 'common';

}

function resetSpin(){

    spinState={
        firstLetter:'?',
        numbers:'???',
        lastLetters:'??',
        region:'???',
        spunLetters:false,
        spunNumbers:false,
        spunRegion:false,
        created:false
    };

}

function spinLetters(){

    const data=randomLetterSet();

    spinState.firstLetter=data.firstLetter;
    spinState.lastLetters=data.lastLetters;
    spinState.spunLetters=true;

    renderCurrentPage();

}

function spinNumbers(){

    spinState.numbers=
        Math.random()<.15
        ? rareDigits()
        : randomDigits();

    spinState.spunNumbers=true;

    renderCurrentPage();

}

function spinRegion(){

    spinState.region=randomRegion();
    spinState.spunRegion=true;

    renderCurrentPage();

}

function finishSpin(){

    if(!spinState.spunLetters){

        const data=randomLetterSet();

        spinState.firstLetter=data.firstLetter;
        spinState.lastLetters=data.lastLetters;
        spinState.spunLetters=true;

    }

    if(!spinState.spunNumbers){

        spinState.numbers=
            Math.random()<.15
            ? rareDigits()
            : randomDigits();

        spinState.spunNumbers=true;

    }

    if(!spinState.spunRegion){

        spinState.region=randomRegion();
        spinState.spunRegion=true;

    }

    spinState.created=true;

    renderCurrentPage();

}

function renderCurrentPage(){

    /*
       Ключевой фикс бага:
       НЕ вызываем showPage('home').
       Рендерим именно открытую страницу.
    */

    if(currentPage==='home')
        document.getElementById('content').innerHTML=homePage();

    if(currentPage==='inventory')

    refreshUser();

}

async function buyCurrent(){

    if(!spinState.created){

        toast('Сначала завершите прокрутку');
        return;

    }

    const code=getFullCode();

    const exists=
        state.plates.some(
            p=>String(p.code).toLowerCase()===code.toLowerCase()
        ) ||
        state.market.some(
            p=>String(p.code).toLowerCase()===code.toLowerCase()
        );

    if(exists){

        toast('Этот номер уже занят');

        resetSpin();
        renderCurrentPage();

        return;

    }

    const rarity=getRarity();

    const price=
        rarity==='gold'
        ? 50000
        : rarity==='rare'
        ? 10000
        : 1000;

    if(Number(currentUser.balance||0)<price){

        toast('Недостаточно средств');
        return;

    }

    currentUser.balance-=price;

    state.plates.push({

        id:uid(),

        ownerId:currentUser.id,

        ownerNickname:currentUser.nickname,

        code,

        firstLetter:spinState.firstLetter,

        numbers:spinState.numbers,

        lastLetters:spinState.lastLetters,

        region:spinState.region,

        rarity,

        price,

        createdAt:new Date().toISOString()

    });

    await cloudSave();

    resetSpin();

    currentPage='inventory';

    showPage('inventory');

    toast('Номер добавлен в инвентарь');

}

async function activatePromo(){

    const input=
        document.getElementById('promoInput');

    const code=
        input.value.trim().toUpperCase();

    if(!code){

        toast('Введите промокод');
        return;

    }

    const promo=
        state.promocodes.find(
            p=>
                String(p.code).toUpperCase()===code
        );

    if(!promo){

        toast('Промокод не найден');
        return;

    }

    if(
        promo.active===false
    ){

        toast('Промокод отключён');
        return;

    }

    if(
        promo.expiresAt &&
        new Date(promo.expiresAt)<new Date()
    ){

        toast('Промокод истёк');
        return;

    }

    if(!Array.isArray(promo.usedBy))
        promo.usedBy=[];

    if(promo.usedBy.includes(currentUser.id)){

        toast('Вы уже использовали этот промокод');
        return;

    }

    if(
        promo.maxUses &&
        promo.usedBy.length>=Number(promo.maxUses)
    ){

        toast('Лимит использований исчерпан');
        return;

    }

    const reward=
        Math.min(
            10000000,
            Math.max(
                0,
                Number(promo.reward||0)
            )
        );

    currentUser.balance+=reward;

    promo.usedBy.push(currentUser.id);

    await cloudSave();

    toast(
        'Промокод активирован: +'+
        reward.toLocaleString('ru-RU')+
        ' ₽'
    );

    showPage('account');

}

async function giveRole(){

        document.getElementById('roleUser').value;

    const role=
        document.getElementById('roleSelect').value;

    const user=
        state.users.find(
            u=>u.id===id
        );

    if(!user)return;

    if(role){

        user.admin=true;
        user.adminRole=role;

    }else{

        user.admin=false;
        user.adminRole=null;

    }

    await cloudSave();

    toast('Должность сохранена');

    adminPage('roles');

}

/* NUMBERS */

function adminNumbers(){

    return `

    <h2>НОМЕРА</h2>

    <div class="field">

        <label>ВЫДАТЬ НОМЕР</label>

        <input id="issueCode"
               placeholder="Е777КХ | 777">

    </div>

    <div class="field">

        <label>ПОЛЬЗОВАТЕЛЬ</label>

        <select id="issueUser">

            ${
                state.users.map(
                    u=>`
                    <option value="${esc(u.id)}">
                        ${esc(u.nickname)}
                    </option>
                    `
                ).join('')
            }

        </select>

    </div>

    <button class="btn primary"
            onclick="issueNumber()">
        ВЫДАТЬ НОМЕР
    </button>

    `;

}

async function issueNumber(){

    const code=
        document.getElementById('issueCode')
        .value.trim().toUpperCase();

    const userId=
        document.getElementById('issueUser')
        .value;

    const match=
        code.match(
            /^([А-ЯЁ])(\d{3})([А-ЯЁ]{2})\s*\|\s*(\d{3})$/i
        );

    if(!match){

        toast('Формат: Е777КХ | 777');
        return;

    }

    const user=
        state.users.find(
            u=>u.id===userId
        );

    if(!user)return;

    const duplicate=
        state.plates.some(
            p=>String(p.code).toUpperCase()===code
        ) ||
        state.market.some(
            p=>String(p.code).toUpperCase()===code
        );

    if(duplicate){

        toast('Этот номер уже существует');
        return;

    }

    const firstLetter=match[1].toUpperCase();
    const numbers=match[2];
    const lastLetters=match[3].toUpperCase();
    const region=match[4];

    const letters=
        firstLetter+lastLetters;

    let rarity='common';

    if(
        numbers[0]===numbers[1] &&
        numbers[1]===numbers[2]
    )
        rarity='gold';

    else if(
        letters[0]===letters[1] &&
        letters[1]===letters[2]
    )
        rarity='gold';

    else if(
        numbers[0]===numbers[1] ||
        numbers[1]===numbers[2] ||
        letters[0]===letters[1] ||
        letters[1]===letters[2]
    )
        rarity='rare';

    state.plates.push({

        id:uid(),
        ownerId:user.id,
        ownerNickname:user.nickname,
        code,
        firstLetter,
        numbers,
        lastLetters,
        region,
        rarity,
        price:1000,
        issuedBy:currentUser.id,
        createdAt:new Date().toISOString()

    });

    await cloudSave();

    toast('Номер выдан');

}


/* =========================================================
   PROMOCODES ADMIN
========================================================= */

function adminPromocodes(){

    return `

    <h2>ПРОМОКОДЫ</h2>

    <div class="field">

        <label>КОД</label>

        <input id="promoCode"
               placeholder="D0NTYYY100">

    </div>

    <div class="field">

        <label>НАГРАДА ₽</label>

        <input id="promoReward"
               type="number"
               min="0"
               max="10000000"
               placeholder="10000">

    </div>

    <div class="field">

        <label>МАКС. ИСПОЛЬЗОВАНИЙ</label>

        <input id="promoMaxUses"
               type="number"
               min="1"
               placeholder="100">

    </div>

    <button class="btn primary"
            onclick="createPromo()">
        СОЗДАТЬ ПРОМОКОД
    </button>

    <div style="margin-top:25px">

        ${
            state.promocodes.length

            ?

            state.promocodes.map(p=>`

                <div class="owned-plate"
                     style="margin-bottom:8px">

                    <div>

                        <div class="mini-code">
                            ${esc(p.code)}
                        </div>

                        <div class="muted">
                            Награда:
                            ${Number(p.reward||0)
                                .toLocaleString('ru-RU')} ₽
                        </div>

                        <div class="muted">
                            Использовано:
                            ${(p.usedBy||[]).length}
                            /
                            ${p.maxUses||'∞'}
                        </div>

                    </div>

                    <button class="btn danger"
                            onclick="togglePromo('${esc(p.id)}')">
                        ${
                            p.active===false
                            ? 'Включить'
                            : 'Отключить'
                        }
                    </button>

                </div>

            `).join('')

            :

            '<div class="muted">Промокодов пока нет.</div>'
        }

    </div>

    `;

}


async function createPromo(){

    const code=
        document.getElementById('promoCode')
        .value.trim().toUpperCase();

    const reward=
        Math.min(
            10000000,
            Math.max(
                0,
                Number(
                    document.getElementById('promoReward')
                    .value||0
                )
            )
        );

    const maxUses=
        Number(
            document.getElementById('promoMaxUses')
            .value||0
        );

    if(!code){

        toast('Введите код');
        return;

    }

    if(state.promocodes.some(
        p=>String(p.code).toUpperCase()===code
    )){

        toast('Такой промокод уже существует');
        return;

    }

    if(reward<=0){

        toast('Награда должна быть больше 0');
        return;

    }

    state.promocodes.push({

        id:uid(),

        code,

        reward,

        maxUses:maxUses>0?maxUses:null,

        active:true,

        usedBy:[],

        createdBy:currentUser.id,

        createdAt:new Date().toISOString()

    });

    await cloudSave();

    toast('Промокод создан');

    adminPage('promocodes');

}


async function togglePromo(id){

    const promo=
        state.promocodes.find(
            p=>p.id===id
        );

    if(!promo)return;

    promo.active=
        promo.active===false;

    await cloudSave();

    adminPage('promocodes');

}

/* =========================================================
   SAFE CLOUD SYNC
========================================================= */

async function syncCloud(){

    if(!currentUser || syncBusy)
        return;

    syncBusy=true;

    try{

        const savedPage=currentPage;
        const savedUserId=currentUser.id;

        await cloudLoad();

        const fresh=
            state.users.find(
                u=>u.id===savedUserId
            );

        if(fresh){

            currentUser=fresh;

            /*
              ГЛАВНЫЙ ФИКС:
              синхронизация больше не вызывает
              startApp() и не открывает home.
            */

            if(currentPage===savedPage)
                renderCurrentPage();

        }

    }finally{

        syncBusy=false;

    }

}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

    state=normalize(state);

    await cloudLoad();

    state=normalize(state);

    await cloudSave();

}

boot();

setInterval(
    syncCloud,
    5000
);
