<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D0NTYYY — License Plates</title>

<style>
:root{
 --bg:#0d0e10;
 --panel:#131519;
 --panel2:#181a1f;
 --line:#292d34;
 --text:#f2f3f5;
 --muted:#8d939c;
 --green:#43d17b;
 --red:#ff4d5a;
 --blue:#6ea8ff;
 --gold:#ffd65b;
}

*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:
  radial-gradient(circle at top,#171a20 0,#0d0e10 45%,#090a0c 100%);
 color:var(--text);

}

button,input,select{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

.topbar{
 height:64px;
 display:flex;
 align-items:center;
 gap:20px;
 padding:0 20px;
 background:rgba(12,13,16,.9);
 border-bottom:1px solid var(--line);
 backdrop-filter:blur(16px);
 position:sticky;
 top:0;
 z-index:20;
}

.brand{
 font-weight:900;
 letter-spacing:1.5px;
 white-space:nowrap;
}

.nav{

 gap:6px;
 flex-wrap:wrap;
}

.nav button,
.btn,
.ghost{
 background:#15181d;
 color:#fff;
 border:1px solid var(--line);
 border-radius:9px;
 padding:10px 13px;
 transition:.15s;
}

.nav button:hover,
.nav button.active,
.btn:hover,
.ghost:hover{
 background:#22262d;
}

.spacer{flex:1}

.page{
 width:min(1100px,100%);
 margin:auto;
 padding:25px 18px 60px;
}

.card{
 background:rgba(19,21,25,.94);
 border:1px solid var(--line);
 border-radius:17px;
 box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.auth{
 width:min(430px,calc(100% - 30px));
 margin:12vh auto;
 padding:25px;
}

.tabs{
 display:flex;
 gap:7px;
 margin:20px 0;
}

.tabs button{flex:1}

.field{
 display:flex;
 flex-direction:column;
 gap:7px;
 margin:12px 0;
}

.field label{
 color:var(--muted);
 font-size:11px;
 font-weight:900;
}

input,select{
 width:100%;
 padding:12px;
 color:#fff;
 background:#0d0f12;
 border:1px solid var(--line);
 border-radius:9px;
 outline:none;
}

input:focus,select:focus{

}

.error{
 color:#ff737c;
 margin-top:12px;
 font-size:13px;
}

.success{
 color:#70e49b;
 margin-top:12px;
 font-size:13px;
}

.muted{
 color:var(--muted);
}

.hero{

 padding:30px;
}

.hero h1{

}

.balance{
 margin:15px 0;
}

.plate-wrap{

 justify-content:center;
 margin:28px 0;
}

.plate{

.main-code{

.region{

.rarity{

.rare-text{color:var(--blue)}

.spin-grid{

.spin-grid button{

 color:#fff;
 border-radius:11px;

}

.spin-grid button:hover{

}

.list{

 gap:10px;
}

.row{

 border:1px solid var(--line);
 border-radius:12px;
 padding:15px;
}

.row-main{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
}

.grid{
 display:grid;

 gap:12px;
}

.badge{

 align-items:center;
 padding:5px 9px;

 font-size:11px;
 font-weight:900;

 color:#ffe27d;

}

.badge.blue{

 background:#10223b;
}

.badge.green{

 background:#10291b;
}

.badge.red{
 color:#ff858c;

}

.admin-overlay{

 inset:0;
 z-index:100;
 background:rgba(0,0,0,.8);
 backdrop-filter:blur(10px);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;

.admin-window{

 height:min(900px,95vh);

 background:#0e1014;
 border:1px solid #353a43;

}

.admin-side{

 overflow:auto;
}

.admin-side button{

 margin-bottom:7px;

 color:#fff;
 background:#12151a;
 border:1px solid var(--line);
 border-radius:9px;
 font-weight:800;

.admin-side button.active{

}

.admin-content{

.admin-head{

 align-items:center;

.toast{
 position:fixed;
 right:18px;
 bottom:18px;
 z-index:300;
 max-width:400px;
 padding:14px;
 background:#171a1f;
 border:1px solid var(--line);
 border-radius:11px;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 padding:11px;
 text-align:left;
 border-bottom:1px solid var(--line);
}

.rank1{

.rank2{

 );

 background:linear-gradient(

@media(max-width:760px){

 .admin-window{

 .admin-side{

  gap:6px;
  overflow:auto;
 }

 .admin-side button{
  min-width:150px;
 }

 .spin-grid{
  grid-template-columns:1fr;

}

<script>

'use strict';


/* =====================================================
   CONFIG
===================================================== */

const SUPABASE_URL =
 'https://wehiexatkhqbfcelvjnr.supabase.co';

const SUPABASE_KEY =
 'sb_publishable_JR5bFKt15zPnzAzeripx8w___vtFpW1';

const OWNER_NICK = 'd0ntyyy';
const OWNER_PASSWORD = 'Semen20151';

const STATE_ID = 1;


/* =====================================================
   STATE
===================================================== */

const DEFAULT_STATE = {

 users:[],
 market:[],
 messages:[],
 punishments:[],
 tags:[],
 plates:[],
 reports:[],
 promocodes:[]

};

let state =
 JSON.parse(JSON.stringify(DEFAULT_STATE));

let currentUser = null;

let authMode = 'login';

let adminSection = 'users';

let saveTimeout = null;

let saving = false;

let dirty = false;


/* =====================================================
   SUPABASE REST
===================================================== */

function supabaseHeaders(){

 return {

  'apikey':SUPABASE_KEY,

  'Authorization':
   'Bearer '+SUPABASE_KEY,

  'Content-Type':
   'application/json',

  'Accept':
   'application/json'

 };

}


async function loadCloud(){

 const response = await fetch(

  SUPABASE_URL+
  '/rest/v1/license_state' +
  '?id=eq.1&select=id,state,updated_at',

  {
   method:'GET',
   headers:supabaseHeaders(),
   cache:'no-store'
  }

 );

 const body =
  await response.text();

 if(!response.ok){

  throw new Error(
   body ||
   'Ошибка Supabase HTTP '+response.status
  );

 }

 let rows;

 try{

  rows=JSON.parse(body);

 }catch{

  throw new Error(
   'Supabase вернул некорректный ответ.'
  );

 }

 if(!rows.length){

  throw new Error(
   'В license_state отсутствует строка id=1.'
  );

 }

 return rows[0];

}


async function saveCloud(){

 if(saving || !dirty)
  return;

 saving=true;

 try{

  const response=await fetch(

   SUPABASE_URL+
   '/rest/v1/license_state?id=eq.1',

   {
    method:'PATCH',

    headers:{
     ...supabaseHeaders(),
     'Prefer':'return=minimal'
    },

    body:JSON.stringify({

     state:state,

     updated_at:
      new Date().toISOString()

    })

   }

  );

  const body=
   await response.text();

  if(!response.ok){

   throw new Error(
    body ||
    'Ошибка сохранения HTTP '+response.status
   );

  }

  dirty=false;

 }catch(error){

  console.error(error);

  toast(
   'Ошибка сохранения в Supabase'
  );

 }finally{

  saving=false;

 }

}


function save(){

 dirty=true;

 clearTimeout(saveTimeout);

 saveTimeout=setTimeout(
  saveCloud,
  300
 );

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(){

 for(const key of Object.keys(DEFAULT_STATE)){

  if(!Array.isArray(state[key]))
   state[key]=[];

 }

 let owner=state.users.find(

  u=>
   String(u.nickname||'')
   .trim()
   .toLowerCase()===OWNER_NICK

 );

 if(!owner){

  owner={

   id:crypto.randomUUID(),

   nickname:OWNER_NICK,

   password:OWNER_PASSWORD,

   accountId:'000001',

   balance:10000000,

   admin:true,

   adminRole:'owner',

   inventory:[],

   adminHistory:[],

   createdAt:Date.now(),

   lastSeen:Date.now()

  };

  state.users.unshift(owner);

 }else{

  owner.nickname=OWNER_NICK;

  owner.password=OWNER_PASSWORD;

  owner.admin=true;

  owner.adminRole='owner';

  owner.balance=
   Math.max(
    Number(owner.balance)||0,
    10000000
   );

  if(!owner.accountId)
   owner.accountId='000001';

  if(!Array.isArray(owner.inventory))
   owner.inventory=[];

  if(!Array.isArray(owner.adminHistory))
   owner.adminHistory=[];

 }


 const usedIDs=new Set();

 for(const user of state.users){

  if(
   !user.id ||
   usedIDs.has(user.id)
  ){

   user.id=crypto.randomUUID();

  }

  usedIDs.add(user.id);


  if(!user.accountId){

   user.accountId=
    String(
     Math.floor(
      100000+
      Math.random()*900000
     )
    );

  }


  if(typeof user.balance!=='number')
   user.balance=100000;

  if(!Array.isArray(user.inventory))
   user.inventory=[];

 }

}


/* =====================================================
   HELPERS
===================================================== */

function esc(value){

 return String(value??'')
  .replace(/[&<>"']/g,char=>({

   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#039;'

  }[char]));

}


function money(value){

 return Number(value||0)
  .toLocaleString('ru-RU');

}


function userById(id){

 return state.users.find(
  u=>u.id===id
 );

}


function userByNick(nick){

 return state.users.find(

  u=>
   String(u.nickname||'')
   .trim()
   .toLowerCase()===

   String(nick||'')
   .trim()
   .toLowerCase()

 );

}


function isOwner(user=currentUser){

 return !!user &&
  String(user.nickname||'')
  .toLowerCase()===OWNER_NICK;

}


function isAdmin(user=currentUser){

 return !!user &&
  (
   user.admin===true ||
   isOwner(user)
  );

}


function toast(message){

 const el=
  document.getElementById('toast');

 el.textContent=message;

 el.classList.remove('hidden');

 clearTimeout(
  el._timer
 );

 el._timer=setTimeout(
  ()=>{
   el.classList.add('hidden');
  },
  3000
 );

}


/* =====================================================
   AUTH
===================================================== */

function renderAuth(){

 document.getElementById(
  'loginTab'
 ).classList.toggle(
  'active',
  authMode==='login'
 );

 document.getElementById(
  'registerTab'
 ).classList.toggle(
  'active',
  authMode==='register'
 );


 document.getElementById(
  'authForm'
 ).innerHTML=`

  <div class="field">

   <label>
    НИКНЕЙМ
   </label>

   <input
    id="authNick"
    autocomplete="username"
    placeholder="Введите никнейм">

  </div>


  <div class="field">

   <label>
    ПАРОЛЬ
   </label>

   <input
    id="authPassword"
    type="password"
    autocomplete="${
     authMode==='login'
      ?'current-password'
      :'new-password'
    }"
    placeholder="Введите пароль">

  </div>


  <button
   id="authSubmit"
   class="btn"
   style="width:100%">

   ${
    authMode==='login'
     ?'ВОЙТИ'
     :'ЗАРЕГИСТРИРОВАТЬСЯ'
   }

  </button>


  <div id="authError"></div>

 `;


 document.getElementById(
  'authSubmit'
 ).onclick=authSubmit;

}


async function authSubmit(){

 const nick=
  document.getElementById(
   'authNick'
  ).value.trim();

 const password=
  document.getElementById(
   'authPassword'
  ).value;

 const error=
  document.getElementById(
   'authError'
  );


 error.textContent='';
 error.className='';


 if(!nick || !password){

  error.className='error';

  error.textContent=
   'Введите никнейм и пароль.';

  return;

 }


 /* ================================================
    OWNER
    Проверяем ДО поиска пользователя.
 ================================================= */

 if(
  nick.toLowerCase()===OWNER_NICK &&
  password===OWNER_PASSWORD
 ){

  let owner=userByNick(
   OWNER_NICK
  );


  if(!owner){

   owner={

    id:crypto.randomUUID(),

    nickname:OWNER_NICK,

    password:OWNER_PASSWORD,

    accountId:'000001',

    balance:10000000,

    admin:true,

    adminRole:'owner',

    inventory:[],

    adminHistory:[],

    createdAt:Date.now(),

    lastSeen:Date.now()

   };

   state.users.unshift(owner);

  }


  owner.nickname=OWNER_NICK;
  owner.password=OWNER_PASSWORD;
  owner.admin=true;
  owner.adminRole='owner';

  owner.balance=
   Math.max(
    Number(owner.balance)||0,
    10000000
   );

  owner.lastSeen=Date.now();


  currentUser=owner;


  sessionStorage.setItem(
   'dpy_session',
   owner.id
  );


  save();

  openApp();

  return;

 }


 /* ================================================
    REGISTRATION
 ================================================= */

 if(authMode==='register'){

  if(userByNick(nick)){

   error.className='error';

   error.textContent=
    'Этот никнейм уже занят.';

   return;

  }


  const user={

   id:crypto.randomUUID(),

   nickname:nick,

   password:password,

   accountId:
    String(
     Math.floor(
      100000+
      Math.random()*900000
     )
    ),

   balance:100000,

   admin:false,

   adminRole:null,

   inventory:[],

   adminHistory:[],

   createdAt:Date.now(),

   lastSeen:Date.now()

  };


  state.users.push(user);

  currentUser=user;


  sessionStorage.setItem(
   'dpy_session',
   user.id
  );


  save();

  openApp();

  return;

 }


 /* ================================================
    NORMAL LOGIN
 ================================================= */

 const user=userByNick(nick);


 if(!user){

  error.className='error';

  error.textContent=
   'Неверный никнейм или пароль.';

  return;

 }


 if(
  String(user.password)!==
  String(password)
 ){

  error.className='error';

  error.textContent=
   'Неверный никнейм или пароль.';

  return;

 }


 user.lastSeen=Date.now();

 currentUser=user;


 sessionStorage.setItem(
  'dpy_session',
  user.id
 );


 save();

 openApp();

}


/* =====================================================
   NAVIGATION
===================================================== */

function buildNav(){

 let html='';

 const pages=[

  ['home','ГЛАВНАЯ'],
  ['inventory','ИНВЕНТАРЬ'],
  ['market','МАГАЗИН'],
  ['top','ТОП'],
  ['account','АККАУНТ']

 ];


 for(const [id,name] of pages){

  html+=`

   <button
    data-page="${id}">

    ${name}

   </button>

  `;

 }


 if(isAdmin()){

  html+=`

   <button id="adminButton">
    АДМИНКА
   </button>

  `;

 }


 document.getElementById(
  'nav'
 ).innerHTML=html;


 document.querySelectorAll(
  '[data-page]'
 ).forEach(button=>{

  button.onclick=()=>{

   openPage(
    button.dataset.page
   );

  };

 });


 const adminButton=
  document.getElementById(
   'adminButton'
  );

 if(adminButton)
  adminButton.onclick=openAdmin;

}


function openApp(){

 document.getElementById(
  'authView'
 ).classList.add('hidden');

 document.getElementById(
  'appView'
 ).classList.remove('hidden');

 buildNav();

 openPage('home');

}


function openPage(page){

 document.querySelectorAll(
  '[data-page]'
 ).forEach(button=>{

  button.classList.toggle(
   'active',
   button.dataset.page===page
  );

 });


 if(page==='home')
  renderHome();

 if(page==='inventory')
  renderInventory();

 if(page==='market')
  renderMarket();

 if(page==='top')
  renderTop();

 if(page==='account')
  renderAccount();

}


/* =====================================================
   PLATE GENERATOR
===================================================== */

const LETTERS=[
 'А','В','Е','К','М',
 'Н','О','Р','С','Т','Х'
];


function randomLetters(){

 let result='';

 for(let i=0;i<3;i++){

  result+=
   LETTERS[
    Math.floor(
     Math.random()*
     LETTERS.length
    )
   ];

 }

 return result;

}


function randomNumbers(){

 const special=[
  '001',
  '007',
  '111',
  '222',
  '333',
  '444',
  '555',
  '666',
  '777',
  '888',
  '999'
 ];


 if(Math.random()<.1){

  return special[
   Math.floor(
    Math.random()*
    special.length
   )
  ];

 }


 return String(
  Math.floor(
   Math.random()*1000
  )
 ).padStart(3,'0');

}


function randomRegion(){

 return String(
  Math.floor(
   Math.random()*1000
  )
 ).padStart(3,'0');

}


function getRarity(letters,numbers){

 if(
  numbers[0]===numbers[1] &&
  numbers[1]===numbers[2]
 )
  return 'gold';


 if(
  letters[0]===letters[1] &&
  letters[1]===letters[2]
 )
  return 'gold';


 if(
  numbers[0]===numbers[1] ||
  numbers[1]===numbers[2] ||
  letters[0]===letters[1] ||
  letters[1]===letters[2]
 )
  return 'rare';


 return 'common';

}


function rarityName(rarity){

 if(rarity==='gold')
  return 'ЗОЛОТОЙ';

 if(rarity==='rare')
  return 'РЕДКИЙ';

 return 'ОБЫЧНЫЙ';

}


function plateCode(plate){

 return plate.letters+
  plate.numbers+
  ' | '+
  plate.region;

}


function plateExists(code){

 const normalized=
  String(code)
   .replace(/\s/g,'')
   .toUpperCase();


 for(const user of state.users){

  for(const plate of user.inventory||[]){

   if(
    String(plate.code)
     .replace(/\s/g,'')
     .toUpperCase()===
    normalized
   )
    return true;

  }

 }


 return state.market.some(
  item=>
   String(item.code)
    .replace(/\s/g,'')
    .toUpperCase()===
   normalized
 );

}

function buyCurrentPlate(){

 ensureSpin();

 const s=
  currentUser.spinState;


 const code=
  s.letters+
  s.numbers+
  ' | '+
  s.region;


 if(plateExists(code)){

  toast(
   'Этот номер уже занят.'
  );

  return;

 }


 const rarity=
  getRarity(
   s.letters,
   s.numbers
  );


 let price=500;


 if(rarity==='rare')
  price=2500;

 if(rarity==='gold')
  price=10000;


 if(
  currentUser.balance<
  price
 ){

  toast(
   'Недостаточно средств.'
  );

  return;

 }


 const plate={

  id:crypto.randomUUID(),

  code:code,

  letters:s.letters,

  numbers:s.numbers,

  region:s.region,

  rarity:rarity,

  active:true,

  createdAt:Date.now()

 };


 currentUser.balance-=price;

 currentUser.inventory.push(
  plate
 );


 save();

 toast(
  'Номер куплен за '+
  money(price)
 );


 renderHome();

}

function buyMarketItem(id){

 const item=
  state.market.find(
   x=>x.id===id
  );

 if(!item)return;


 if(
  item.sellerId===
  currentUser.id
 ){

  toast(
   'Нельзя купить собственный номер.'
  );

  return;

 }


 if(
  currentUser.balance<
  item.price
 ){

  toast(
   'Недостаточно средств.'
  );

  return;

 }


 const seller=
  userById(
   item.sellerId
  );

 if(!seller){

  toast(
   'Продавец не найден.'
  );

  return;

 }


 const plate=
  seller.inventory.find(
   p=>p.id===item.plateId
  );

 if(!plate){

  state.market=
   state.market.filter(
    x=>x.id!==item.id
   );

  save();

  renderMarket();

  return;

 }


 currentUser.balance-=item.price;

 seller.balance+=item.price;

 currentUser.inventory.push(
  plate
 );

 seller.inventory=
  seller.inventory.filter(
   p=>p.id!==plate.id
  );

 state.market=
  state.market.filter(
   x=>x.id!==item.id
  );

 save();

 toast('Номер куплен.');

 renderMarket();

}

function issueNumber(){

 const user=
  userById(
   document.getElementById(
    'issueUser'
   ).value
  );


 const code=
  document.getElementById(
   'issueCode'
  ).value.trim();


 if(!user || !code){

  toast(
   'Заполните поля.'
  );

  return;

 }


 if(plateExists(code)){

  toast(
   'Такой номер уже существует.'
  );

  return;

 }


 const letters=
  code
   .replace(
    /[^А-ЯA-Z]/gi,
    ''
   )
   .toUpperCase()
   .slice(0,3);


 const numbers=
  (
   code.match(
    /\d{3}/
   )||['000']
  )[0];


 const region=
  (
   code.match(
    /\|\s*(\d{3})/
   )||['','000']
  )[1];


 user.inventory.push({

  id:crypto.randomUUID(),

  code:code,

  letters:letters,

  numbers:numbers,

  region:region,

  rarity:getRarity(
   letters,
   numbers
  ),

  active:true,

  createdAt:Date.now()

 });


 save();

 renderAdmin();

 toast(
  'Номер выдан.'
 );

}

/* =====================================================
   LOGOUT
===================================================== */

document.getElementById(
 'logoutBtn'
).onclick=()=>{

 if(currentUser){

  currentUser.lastSeen=Date.now();

  save();

 }


 currentUser=null;

 sessionStorage.removeItem(
  'dpy_session'
 );


 document.getElementById(
  'appView'
 ).classList.add('hidden');


 document.getElementById(
  'authView'
 ).classList.remove('hidden');


 renderAuth();

};


document.getElementById(
 'loginTab'
).onclick=()=>{

 authMode='login';

 renderAuth();

};


document.getElementById(
 'registerTab'
).onclick=()=>{

 authMode='register';

 renderAuth();

};


document.getElementById(
 'closeAdmin'
).onclick=closeAdmin;


/* =====================================================
   CROSS DEVICE
===================================================== */

async function syncCloud(){

 if(dirty || saving)
  return;


 try{

  const row=
   await loadCloud();


  const oldUserId=
   currentUser?.id;


  state={
   ...JSON.parse(
    JSON.stringify(
     DEFAULT_STATE
    )
   ),
   ...(row.state||{})
  };


  normalize();


  if(oldUserId){

   const fresh=
    userById(oldUserId);


   if(!fresh){

    currentUser=null;

    sessionStorage.removeItem(
     'dpy_session'
    );

    document.getElementById(
     'appView'
    ).classList.add(
     'hidden'
    );

    document.getElementById(
     'authView'
    ).classList.remove(
     'hidden'
    );

    renderAuth();

    return;

   }


   currentUser=fresh;


   buildNav();


   const active=
    document.querySelector(
     '[data-page].active'
    );


   if(active)
    openPage(
     active.dataset.page
    );

  }

 }catch(error){

  console.error(
   'SYNC ERROR:',
   error
  );

 }

}


setInterval(
 syncCloud,
 3000
);


window.addEventListener(
 'beforeunload',
 ()=>{
  if(dirty)
   saveCloud();
 }
);


/* =====================================================
   BOOT
===================================================== */

async function boot(){

 renderAuth();


 try{

  const row=
   await loadCloud();


  state={
   ...JSON.parse(
    JSON.stringify(
     DEFAULT_STATE
    )
   ),
   ...(row.state||{})
  };


  normalize();


  /*
   Если owner был создан автоматически,
   отправляем его в Supabase.
  */

  dirty=true;

  await saveCloud();


  const session=
   sessionStorage.getItem(
    'dpy_session'
   );


  if(session){

   const user=
    userById(session);


   if(user){

    currentUser=user;

    openApp();

    return;

   }

  }


  renderAuth();


 }catch(error){

  console.error(error);


  document.getElementById(
   'authForm'
  ).innerHTML=`

   <div class="error">

    ОШИБКА ПОДКЛЮЧЕНИЯ К SUPABASE

   </div>

   <div
    class="muted"
    style="
     margin-top:10px;
     font-size:12px;
     word-break:break-word">

    ${esc(error.message)}

   </div>

  `;

 }

}


boot();

</script>
