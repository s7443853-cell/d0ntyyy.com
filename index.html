<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D0NTYYY — License Plates</title>
<style>
:root{
--bg:#0d0e10;--panel:#131519;--panel2:#181a1f;--line:#292d34;
--text:#f2f3f5;--muted:#8d939c;--green:#43d17b;--red:#ff4d5a;
--blue:#6ea8ff;--gold:#ffd65b
}
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;background:
radial-gradient(circle at top,#191c22,#0d0e10 55%,#090a0c);
color:var(--text);font-family:Arial,Segoe UI,sans-serif
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{
position:sticky;top:0;z-index:20;min-height:64px;padding:12px 18px;
display:flex;align-items:center;gap:15px;background:rgba(10,11,13,.9);
backdrop-filter:blur(15px);border-bottom:1px solid var(--line)
}
.brand{font-weight:900;letter-spacing:1.5px;white-space:nowrap}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button,.btn,.ghost{
border:1px solid var(--line);background:#15181d;color:#fff;
padding:10px 13px;border-radius:9px
}
.nav button:hover,.nav button.active,.btn:hover,.ghost:hover{background:#24282f}
.spacer{flex:1}
.page{max-width:1100px;margin:auto;padding:25px 18px 60px}
.card{
background:rgba(19,21,25,.95);border:1px solid var(--line);
border-radius:17px;box-shadow:0 24px 80px rgba(0,0,0,.45)
}
.auth{max-width:430px;margin:12vh auto;padding:25px}
.tabs{display:flex;gap:7px;margin:20px 0}
.tabs button{flex:1}
.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}
.field label{font-size:11px;color:var(--muted);font-weight:900}
input,select{
width:100%;padding:12px;background:#0d0f12;color:#fff;
border:1px solid var(--line);border-radius:9px;outline:none
}
input:focus,select:focus{border-color:#687382}
.error{color:#ff737c;font-size:13px;margin-top:12px}
.muted{color:var(--muted)}
.hero{text-align:center;padding:30px}
.hero h1{margin:0 0 8px}
.balance{margin:15px 0}
.plate-wrap{display:flex;justify-content:center;margin:28px 0}
.plate{
width:min(650px,95vw);min-height:130px;padding:20px 28px;
display:flex;align-items:center;justify-content:center;gap:18px;
border-radius:18px;background:linear-gradient(#fafafa,#cfd1d4);
color:#111;border:4px solid #292c30
}
.plate.gold{box-shadow:0 0 45px rgba(255,214,91,.4)}
.plate.rare{box-shadow:0 0 40px rgba(110,168,255,.35)}
.main-code{font-size:clamp(35px,8vw,72px);font-weight:1000;letter-spacing:4px}
.region{font-size:23px;font-weight:900;padding-left:15px;border-left:2px solid #999}
.rarity{font-weight:900}
.gold-text{color:var(--gold)}
.rare-text{color:var(--blue)}
.spin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.spin-grid button{
min-height:62px;background:#15181d;border:1px solid var(--line);
color:#fff;border-radius:11px;font-weight:900
}
.spin-grid button:hover{background:#24282f}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:#111318;border:1px solid var(--line);border-radius:12px;padding:15px}
.row-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.badge{
display:inline-flex;padding:5px 9px;border:1px solid var(--line);
border-radius:99px;font-size:11px;font-weight:900
}
.badge.gold{color:#ffe27d;background:#332b12}
.badge.blue{color:#a9c8ff;background:#10223b}
.badge.green{color:#73e4a0;background:#10291b}
.admin-overlay{
position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);
backdrop-filter:blur(10px);display:flex;align-items:center;
justify-content:center;padding:18px
}
.admin-window{
width:min(1350px,98vw);height:min(900px,95vh);
display:grid;grid-template-columns:240px 1fr;background:#0e1014;
border:1px solid #353a43;border-radius:19px;overflow:hidden
}
.admin-side{padding:14px;border-right:1px solid var(--line);overflow:auto}
.admin-side button{
width:100%;margin-bottom:7px;padding:12px;text-align:left;color:#fff;
background:#12151a;border:1px solid var(--line);border-radius:9px;font-weight:800
}
.admin-side button.active{background:#252a31}
.admin-content{padding:23px;overflow:auto}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.toast{
position:fixed;right:18px;bottom:18px;z-index:300;max-width:400px;
padding:14px;background:#171a1f;border:1px solid var(--line);border-radius:11px
}
table{width:100%;border-collapse:collapse}
th,td{padding:11px;text-align:left;border-bottom:1px solid var(--line)}
.rank1{background:linear-gradient(90deg,rgba(255,214,91,.2),transparent)}
.rank2{background:linear-gradient(90deg,rgba(210,215,224,.17),transparent)}
.rank3{background:linear-gradient(90deg,rgba(194,131,80,.18),transparent)}
@media(max-width:760px){
.topbar{flex-wrap:wrap}.nav{order:3;width:100%}
.admin-window{grid-template-columns:1fr}
.admin-side{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px}
.admin-side button{min-width:150px}
.spin-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="authView">
<div class="card auth">
<div class="brand" style="font-size:22px">D0NTYYY — LICENSE PLATES</div>

<button id="loginTab" class="btn">Войти</button>
<button id="registerTab" class="btn">Регистрация</button>

<div>
<div style="font-size:20px;font-weight:900">АДМИН-ПАНЕЛЬ</div>

<div id="toast" class="toast hidden"></div>

<script>
'use strict';

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL='https://wehiexatkhqbfcelvjnr.supabase.co';
const SUPABASE_KEY='sb_publishable_JR5bFKt15zPnzAzeripx8w___vtFpW1';

const OWNER='d0ntyyy';
const OWNER_PASSWORD='Semen20151';

const DEFAULT_STATE={
users:[],
market:[],
messages:[],
punishments:[],
tags:[],
plates:[],
reports:[],
promocodes:[]
};

let state=JSON.parse(JSON.stringify(DEFAULT_STATE));
let currentUser=null;
let authMode='login';
let adminSection='users';
let saveTimer=null;
let dirty=false;
let saving=false;


/* =========================
   SUPABASE REST
========================= */

function sbHeaders(){
return{
'apikey':SUPABASE_KEY,
'Authorization':'Bearer '+SUPABASE_KEY,
'Content-Type':'application/json',
'Accept':'application/json'
};
}

async function cloudLoad(){

const r=await fetch(
SUPABASE_URL+
'/rest/v1/license_state?id=eq.1&select=id,state,updated_at',
{
method:'GET',
headers:sbHeaders(),
cache:'no-store'
}
);

const text=await r.text();

if(!r.ok)
throw new Error(text||('HTTP '+r.status));

let rows;

try{
rows=JSON.parse(text);
}catch{
throw new Error('Supabase вернул некорректный ответ.');
}

if(!rows.length)
throw new Error('В license_state нет записи id=1.');

return rows[0];
}

async function cloudSave(){

if(saving||!dirty)return;

saving=true;

try{

const r=await fetch(
SUPABASE_URL+'/rest/v1/license_state?id=eq.1',
{
method:'PATCH',
headers:{
...sbHeaders(),
'Prefer':'return=minimal'
},
body:JSON.stringify({
state:state,
updated_at:new Date().toISOString()
})
}
);

const text=await r.text();

if(!r.ok)
throw new Error(text||('HTTP '+r.status));

dirty=false;

}catch(e){

console.error(e);
toast('Ошибка сохранения: '+e.message);

}finally{

saving=false;

}
}

function save(){

dirty=true;

clearTimeout(saveTimer);

saveTimer=setTimeout(cloudSave,300);

}


/* =========================
   HELPERS
========================= */

function esc(v){
return String(v??'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m]));
}

function uid(){
return crypto.randomUUID();
}

function money(v){
return Number(v||0).toLocaleString('ru-RU');
}

function userById(id){
return state.users.find(u=>u.id===id);
}

function userByNick(nick){
return state.users.find(
u=>String(u.nickname||'').trim().toLowerCase()===
String(nick||'').trim().toLowerCase()
);
}

function isOwner(u=currentUser){
return !!u&&String(u.nickname||'').toLowerCase()===OWNER;
}

function isAdmin(u=currentUser){
return !!u&&(u.admin===true||isOwner(u));
}

function toast(text){
const el=document.getElementById('toast');
el.textContent=text;
el.classList.remove('hidden');
clearTimeout(el._timer);
el._timer=setTimeout(()=>el.classList.add('hidden'),3000);
}


/* =========================
   NORMALIZE
========================= */

function normalize(){

for(const k of Object.keys(DEFAULT_STATE)){
if(!Array.isArray(state[k]))state[k]=[];
}

let owner=userByNick(OWNER);

if(!owner){

owner={
id:uid(),
nickname:OWNER,
password:OWNER_PASSWORD,
accountId:'000001',
balance:10000000,
admin:true,
adminRole:'owner',
inventory:[],
adminHistory:[],
createdAt:Date.now(),
lastSeen:Date.now()
};

state.users.unshift(owner);

}else{

owner.nickname=OWNER;
owner.password=OWNER_PASSWORD;
owner.admin=true;
owner.adminRole='owner';
owner.balance=Math.max(Number(owner.balance)||0,10000000);

if(!owner.accountId)owner.accountId='000001';
if(!Array.isArray(owner.inventory))owner.inventory=[];
if(!Array.isArray(owner.adminHistory))owner.adminHistory=[];

}

const ids=new Set();

for(const u of state.users){

if(!u.id||ids.has(u.id))u.id=uid();

ids.add(u.id);

if(!u.accountId){
u.accountId=String(
Math.floor(100000+Math.random()*900000)
);
}

if(typeof u.balance!=='number')u.balance=100000;
if(!Array.isArray(u.inventory))u.inventory=[];
if(!Array.isArray(u.adminHistory))u.adminHistory=[];

}

}


/* =========================
   AUTH
========================= */

function renderAuth(){

document.getElementById('loginTab')
.classList.toggle('active',authMode==='login');

document.getElementById('registerTab')
.classList.toggle('active',authMode==='register');

document.getElementById('authForm').innerHTML=`

<div class="field">
<label>НИКНЕЙМ</label>
<input id="authNick" autocomplete="username" placeholder="Введите никнейм">
</div>

<div class="field">
<label>ПАРОЛЬ</label>
<input id="authPass" type="password"
autocomplete="${authMode==='login'?'current-password':'new-password'}"
placeholder="Введите пароль">
</div>

<button id="authSubmit" class="btn" style="width:100%">
${authMode==='login'?'ВОЙТИ':'ЗАРЕГИСТРИРОВАТЬСЯ'}
</button>

<div id="authError"></div>
`;

document.getElementById('authSubmit').onclick=authSubmit;
}

async function authSubmit(){

const nick=document.getElementById('authNick').value.trim();
const pass=document.getElementById('authPass').value;
const error=document.getElementById('authError');

error.textContent='';
error.className='';

if(!nick||!pass){
error.className='error';
error.textContent='Введите никнейм и пароль.';
return;
}

/* OWNER */

if(nick.toLowerCase()===OWNER&&pass===OWNER_PASSWORD){

let owner=userByNick(OWNER);

if(!owner){

owner={
id:uid(),
nickname:OWNER,
password:OWNER_PASSWORD,
accountId:'000001',
balance:10000000,
admin:true,
adminRole:'owner',
inventory:[],
adminHistory:[],
createdAt:Date.now(),
lastSeen:Date.now()
};

state.users.unshift(owner);

}else{

owner.nickname=OWNER;
owner.password=OWNER_PASSWORD;
owner.admin=true;
owner.adminRole='owner';
owner.balance=Math.max(Number(owner.balance)||0,10000000);

}

owner.lastSeen=Date.now();

currentUser=owner;

sessionStorage.setItem('dpy_session',owner.id);

save();
openApp();
return;
}


/* REGISTRATION */

if(authMode==='register'){

if(userByNick(nick)){

error.className='error';
error.textContent='Этот никнейм уже занят.';
return;

}

const user={
id:uid(),
nickname:nick,
password:pass,
accountId:String(Math.floor(100000+Math.random()*900000)),
balance:100000,
admin:false,
adminRole:null,
inventory:[],
adminHistory:[],
createdAt:Date.now(),
lastSeen:Date.now()
};

state.users.push(user);
currentUser=user;

sessionStorage.setItem('dpy_session',user.id);

save();
openApp();
return;
}


/* LOGIN */

const user=userByNick(nick);

if(!user||String(user.password)!==String(pass)){

error.className='error';
error.textContent='Неверный никнейм или пароль.';
return;

}

user.lastSeen=Date.now();

currentUser=user;

sessionStorage.setItem('dpy_session',user.id);

save();
openApp();

}


/* =========================
   NAV
========================= */

function buildNav(){

let html='';

[
['home','ГЛАВНАЯ'],
['inventory','ИНВЕНТАРЬ'],
['market','МАГАЗИН'],
['top','ТОП'],
['account','АККАУНТ']
].forEach(([id,title])=>{
html+=`<button data-page="${id}">${title}</button>`;
});

if(isAdmin())
html+=`<button id="adminButton">АДМИНКА</button>`;

document.getElementById('nav').innerHTML=html;

document.querySelectorAll('[data-page]').forEach(b=>{
b.onclick=()=>openPage(b.dataset.page);
});

document.getElementById('adminButton')?.addEventListener(
'click',openAdmin
);

}

function openApp(){

document.getElementById('authView').classList.add('hidden');
document.getElementById('appView').classList.remove('hidden');

buildNav();
openPage('home');

}

function openPage(page){

document.querySelectorAll('[data-page]').forEach(b=>{
b.classList.toggle('active',b.dataset.page===page);
});

if(page==='home')renderHome();
if(page==='inventory')renderInventory();
if(page==='market')renderMarket();
if(page==='top')renderTop();
if(page==='account')renderAccount();

}


/* =========================
   PLATES
========================= */

const LETTERS=['А','В','Е','К','М','Н','О','Р','С','Т','Х'];

function randomLetters(){

return Array.from({length:3},()=>{
return LETTERS[Math.floor(Math.random()*LETTERS.length)];
}).join('');

}

function randomNumbers(){

const special=[
'001','007','111','222','333',
'444','555','666','777','888','999'
];

if(Math.random()<.1)
return special[Math.floor(Math.random()*special.length)];

return String(Math.floor(Math.random()*1000)).padStart(3,'0');

}

function randomRegion(){
return String(Math.floor(Math.random()*1000)).padStart(3,'0');
}

function getRarity(l,n){

if(
n[0]===n[1]&&
n[1]===n[2]
)return'gold';

if(
l[0]===l[1]&&
l[1]===l[2]
)return'gold';

if(
n[0]===n[1]||
n[1]===n[2]||
l[0]===l[1]||
l[1]===l[2]
)return'rare';

return'common';
}

function rarityName(r){
return r==='gold'?'ЗОЛОТОЙ':
r==='rare'?'РЕДКИЙ':'ОБЫЧНЫЙ';
}

function plateExists(code){

const x=String(code).replace(/\s/g,'').toUpperCase();

for(const u of state.users){
for(const p of u.inventory||[]){
if(String(p.code).replace(/\s/g,'').toUpperCase()===x)
return true;
}
}

return state.market.some(
p=>String(p.code).replace(/\s/g,'').toUpperCase()===x
);

}


/* =========================
   HOME
========================= */

function renderHome(){

if(!currentUser)return;

if(!currentUser.spinState){
currentUser.spinState={
letters:'ААА',
numbers:'000',
region:'000',
created:false
};
}

const s=currentUser.spinState;
const r=s.created?getRarity(s.letters,s.numbers):'common';

document.getElementById('pages').innerHTML=`

<div class="page">

<div class="card hero">

<h1>КРУТИЛКА НОМЕРОВ</h1>

<div class="muted">
Крути отдельно буквы, цифры и регион.
</div>

<div class="plate-wrap">

<div class="plate ${r}">

<div class="main-code">
${s.created?esc(s.letters+s.numbers):'---'}
</div>

<div class="region">
RUS<br>
${s.created?esc(s.region):'---'}
</div>

</div>

</div>

<div class="rarity ${
r==='gold'?'gold-text':
r==='rare'?'rare-text':''
}">
${s.created?rarityName(r):'—'}
</div>

<div class="balance">
Баланс: <b>${money(currentUser.balance)}</b>
</div>

<div class="spin-grid">

<button onclick="spinLetters()">БУКВЫ</button>
<button onclick="spinNumbers()">ЦИФРЫ</button>
<button onclick="spinRegion()">РЕГИОН</button>

</div>

<div style="margin-top:15px">
<button class="btn" onclick="buyCurrent()">КУПИТЬ НОМЕР</button>
</div>

</div>
</div>
`;

}

function ensureSpin(){

if(!currentUser.spinState){
currentUser.spinState={
letters:randomLetters(),
numbers:randomNumbers(),
region:randomRegion(),
created:true
};
}

}

function spinLetters(){
ensureSpin();
currentUser.spinState.letters=randomLetters();
currentUser.spinState.created=true;
save();
renderHome();
}

function spinNumbers(){
ensureSpin();
currentUser.spinState.numbers=randomNumbers();
currentUser.spinState.created=true;
save();
renderHome();
}

function spinRegion(){
ensureSpin();
currentUser.spinState.region=randomRegion();
currentUser.spinState.created=true;
save();
renderHome();
}

function buyCurrent(){

ensureSpin();

const s=currentUser.spinState;
const code=s.letters+s.numbers+' | '+s.region;

if(plateExists(code)){
toast('Этот номер уже занят.');
return;
}

const rarity=getRarity(s.letters,s.numbers);

let price=500;
if(rarity==='rare')price=2500;
if(rarity==='gold')price=10000;

if(currentUser.balance<price){
toast('Недостаточно средств.');
return;
}

currentUser.balance-=price;

currentUser.inventory.push({
id:uid(),
code,
letters:s.letters,
numbers:s.numbers,
region:s.region,
rarity,
active:true,
createdAt:Date.now()
});

save();

toast('Номер куплен за '+money(price));
renderHome();

}


/* =========================
   INVENTORY
========================= */

function renderInventory(){

const items=currentUser.inventory||[];

document.getElementById('pages').innerHTML=`

<div class="page">

<div class="card" style="padding:22px">

<h2>ИНВЕНТАРЬ</h2>

${
items.length
?`
<div class="list">

${items.map(p=>`

<div class="row">

<div class="row-main">

<div>

<div style="font-size:23px;font-weight:1000">
${esc(p.code)}
</div>

<div class="muted">
${rarityName(p.rarity)}
</div>

</div>

<button class="btn"
onclick="sellPlate('${p.id}')">
ВЫСТАВИТЬ
</button>

</div>

</div>

`).join('')}

</div>
`
:
`<div class="muted">Инвентарь пуст.</div>`
}

</div>
</div>
`;

}

function sellPlate(id){

const p=currentUser.inventory.find(x=>x.id===id);
if(!p)return;

const input=prompt('Цена от 1 до 10 000 000:');
if(input===null)return;

const price=Number(input);

if(!Number.isInteger(price)||price<1||price>10000000){
toast('Неверная цена.');
return;
}

if(state.market.some(x=>x.plateId===p.id)){
toast('Номер уже выставлен.');
return;
}

state.market.push({
id:uid(),
plateId:p.id,
code:p.code,
sellerId:currentUser.id,
sellerNick:currentUser.nickname,
price,
createdAt:Date.now()
});

save();
renderInventory();
toast('Номер выставлен.');

}


/* =========================
   MARKET
========================= */

function renderMarket(){

document.getElementById('pages').innerHTML=`

<div class="page">

<div class="card" style="padding:22px">

<h2>МАГАЗИН</h2>

${
state.market.length
?
`
<div class="grid">

${state.market.map(m=>`

<div class="row">

<div style="font-size:25px;font-weight:1000">
${esc(m.code)}
</div>

<div class="muted">
Продавец: ${esc(m.sellerNick)}
</div>

<div style="font-size:20px;font-weight:900;margin:12px 0">
${money(m.price)}
</div>

${
m.sellerId===currentUser.id
?
'<span class="badge blue">ВАШ НОМЕР</span>'
:
`<button class="btn"
onclick="buyMarket('${m.id}')">
КУПИТЬ
</button>`
}

</div>

`).join('')}

</div>
`
:
'<div class="muted">На маркете нет номеров.</div>'
}

</div>
</div>
`;

}

function buyMarket(id){

const m=state.market.find(x=>x.id===id);
if(!m)return;

if(m.sellerId===currentUser.id){
toast('Нельзя купить свой номер.');
return;
}

if(currentUser.balance<m.price){
toast('Недостаточно средств.');
return;
}

const seller=userById(m.sellerId);

if(!seller){
toast('Продавец не найден.');
return;
}

const p=seller.inventory.find(x=>x.id===m.plateId);

if(!p){

state.market=state.market.filter(x=>x.id!==id);
save();
renderMarket();
return;

}

currentUser.balance-=m.price;
seller.balance+=m.price;

currentUser.inventory.push(p);

seller.inventory=seller.inventory.filter(
x=>x.id!==p.id
);

state.market=state.market.filter(
x=>x.id!==id
);

save();
toast('Номер куплен.');
renderMarket();

}

function issueNumber(){

if(!isOwner())return;

const u=userById(
document.getElementById('issueUser').value
);

const code=document.getElementById('issueCode').value.trim();

if(!u||!code){
toast('Заполните поля.');
return;
}

if(plateExists(code)){
toast('Такой номер уже существует.');
return;
}

const letters=code.replace(/[^А-ЯA-Z]/gi,'')
.toUpperCase().slice(0,3);

const numbers=(code.match(/\d{3}/)||['000'])[0];

const region=(code.match(/\|\s*(\d{3})/)||['','000'])[1];

u.inventory.push({
id:uid(),
code,
letters,
numbers,
region,
rarity:getRarity(letters,numbers),
active:true,
createdAt:Date.now()
});

save();
renderAdmin();
toast('Номер выдан.');

}

/* =========================
   АВТОСИНХРОНИЗАЦИЯ
========================= */

async function syncCloud(){

if(dirty||saving)return;

try{

const row=await cloudLoad();

const currentId=currentUser?.id;

state={
...JSON.parse(JSON.stringify(DEFAULT_STATE)),
...(row.state||{})
};

normalize();

if(currentId){

const fresh=userById(currentId);

if(!fresh)return;

currentUser=fresh;

buildNav();

}

}catch(e){

console.error('SYNC',e);

}

}

setInterval(syncCloud,3000);

window.addEventListener('beforeunload',()=>{
if(dirty)cloudSave();
});


/* =========================
   BOOT
========================= */

async function boot(){

renderAuth();

try{

const row=await cloudLoad();

state={
...JSON.parse(JSON.stringify(DEFAULT_STATE)),
...(row.state||{})
};

normalize();

/*
Если владельца ещё не было,
создаём его и отправляем в Supabase.
*/
dirty=true;
await cloudSave();

const session=sessionStorage.getItem('dpy_session');

if(session){

const u=userById(session);

if(u){

currentUser=u;
openApp();
return;

}

}

renderAuth();

}catch(e){

console.error(e);

document.getElementById('authForm').innerHTML=`

<div class="error">
Ошибка подключения к базе данных
</div>

<div class="muted"
style="margin-top:10px;word-break:break-word;font-size:12px">
${esc(e.message)}
</div>

`;

}

}

boot();
