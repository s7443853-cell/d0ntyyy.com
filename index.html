<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D0NTYYY — License Plates</title>

<style>
:root{
  --bg:#0b0d10;
  --panel:#13161b;
  --panel2:#181c22;
  --line:#292e36;
  --text:#f4f5f7;
  --muted:#8e96a2;
  --green:#43d17b;
  --red:#ff5360;
  --blue:#6ea8ff;
  --gold:#ffd65b;
  --shadow:0 25px 90px rgba(0,0,0,.45);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#171a20 0,#0b0d10 42%,#07080a 100%);
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.hidden{display:none!important}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 18px;
  background:rgba(9,11,14,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.brand{
  font-weight:950;
  letter-spacing:1px;
}

.nav{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.nav button,
.ghost{
  border:1px solid var(--line);
  background:#111419;
  color:#dfe2e7;
  padding:9px 12px;
  border-radius:9px;
}

.nav button:hover,
.nav button.active,
.ghost:hover{
  background:#1d2229;
  color:#fff;
}

.spacer{flex:1}

.page{
  max-width:1150px;
  margin:auto;
  padding:25px 18px 70px;
}

.card{
  background:rgba(19,22,27,.91);
  border:1px solid var(--line);
  border-radius:17px;
  box-shadow:var(--shadow);
}

.auth{
  width:min(430px,95vw);
  margin:10vh auto;
  padding:25px;
}

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:18px;
}

.tabs button{flex:1}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin:12px 0;
}

.field label{
  color:var(--muted);
  font-size:11px;
  font-weight:850;
  letter-spacing:.8px;
}

input,select,textarea{
  width:100%;
  background:#0e1014;
  color:#fff;
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px 12px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#555d68;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.btn{
  border:1px solid var(--line);
  background:#1a1e24;
  color:#fff;
  padding:10px 14px;
  border-radius:9px;
}

.btn:hover{background:#252a32}

.btn-green{
  background:#153c27;
  border-color:#2c6743;
}

.btn-red{
  background:#3b181d;
  border-color:#683039;
}

.btn-blue{
  background:#172941;
  border-color:#315786;
}

.btn-gold{
  background:#3b3117;
  border-color:#6d5b20;
}

.stack{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.error{
  color:#ff747d;
  font-size:13px;
  margin-top:9px;
}

.ok{
  color:#65dc91;
  font-size:13px;
  margin-top:9px;
}

.muted{color:var(--muted)}
.small{font-size:12px}
.center{text-align:center}
.mt{margin-top:14px}

.hero{
  padding:35px;
  text-align:center;
}

.hero h1{
  margin:0 0 8px;
  font-size:30px;
}

.sub{color:var(--muted)}

.balance{
  text-align:center;
  margin:15px 0;
  color:#d2d5db;
}

.plate-wrap{
  display:flex;
  justify-content:center;
  margin:28px 0 18px;
}

.plate{
  position:relative;
  width:min(650px,94vw);
  min-height:125px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  padding:18px 25px;
  border-radius:17px;
  background:linear-gradient(#fafafa,#cdd0d4);
  color:#111;
  border:4px solid #25282d;
  box-shadow:
    inset 0 2px 0 #fff,
    inset 0 -3px 0 rgba(0,0,0,.15),
    0 8px 35px rgba(255,255,255,.08);
}

.plate.gold{
  box-shadow:
    0 0 0 2px rgba(255,214,91,.2),
    0 0 50px rgba(255,196,40,.48),
    inset 0 2px 0 #fff;
}

.plate.rare{
  box-shadow:
    0 0 0 2px rgba(110,168,255,.18),
    0 0 40px rgba(90,140,255,.35),
    inset 0 2px 0 #fff;
}

.main-code{
  font-size:clamp(38px,7vw,70px);
  font-weight:1000;
  letter-spacing:4px;
}

.region{
  align-self:flex-start;
  margin-top:20px;
  padding-left:12px;
  border-left:2px solid #999;
  font-weight:900;
  font-size:25px;
}

.rarity{
  font-weight:850;
  font-size:13px;
}

.rarity.gold{color:var(--gold)}
.rarity.rare{color:var(--blue)}
.rarity.common{color:#adb3bc}

.spin-area{
  padding:24px;
}

.spin-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.spin-grid button{
  min-height:60px;
  border:1px solid var(--line);
  background:#15181d;
  color:#fff;
  border-radius:11px;
  font-weight:900;
}

.spin-grid button:hover{background:#22272f}

.info-row{
  display:flex;
  justify-content:center;
  gap:22px;
  flex-wrap:wrap;
  color:#a8aeb7;
  font-size:13px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.row{
  padding:15px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#111419;
}

.row-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  border:1px solid var(--line);
  font-size:11px;
}

.badge.green{color:#73dfa0;background:#10291b}
.badge.red{color:#ff8991;background:#301317}
.badge.gold{color:#ffe184;background:#30270f}
.badge.blue{color:#9fc3ff;background:#10223b}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.three{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.section-title{
  font-size:19px;
  font-weight:950;
  margin-bottom:13px;
}

.metric{
  padding:17px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#111419;
}

.metric b{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.inventory-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#111419;
}

.market-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:12px;
}

.market-card{
  padding:15px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#111419;
}

.market-code{
  font-size:23px;
  font-weight:1000;
}

.price{
  font-size:20px;
  font-weight:900;
  margin:10px 0;
}

.msg-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.msg{
  padding:15px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#111419;
}

.msg.unread{
  border-color:#4b5665;
}

.msg .title{
  font-weight:900;
  margin-bottom:8px;
}

.msg pre{
  white-space:pre-wrap;
  font:inherit;
  color:#d5d8dd;
  margin:0;
}

.admin-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(3,4,5,.8);
  backdrop-filter:blur(12px);
}

.admin-window{
  width:min(1400px,98vw);
  max-height:95vh;
  display:grid;
  grid-template-columns:260px 1fr;
  background:#0f1115;
  border:1px solid #30353d;
  border-radius:21px;
  overflow:hidden;
  box-shadow:0 30px 110px rgba(0,0,0,.75);
}

.admin-side{
  padding:18px;
  border-right:1px solid var(--line);
  background:#0b0d10;
}

.admin-side button{
  width:100%;
  text-align:left;
  margin-bottom:7px;
  padding:13px 14px;
}

.admin-side button.active{
  background:#1b2027;
}

.admin-content{
  padding:27px;
  overflow:auto;
}

.admin-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.admin-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{grid-column:1/-1}

.hr{
  height:1px;
  background:var(--line);
  margin:18px 0;
}

.admin-users-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:12px;
}

.admin-user-card{
  padding:16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#111419;
}

.admin-report{
  padding:16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#111419;
}

.answer-box{
  margin-top:12px;
  padding:12px;
  border-left:2px solid #3d4856;
  background:#0d1014;
  border-radius:8px;
}

.top-table{
  width:100%;
  border-collapse:collapse;
}

.top-table th,
.top-table td{
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.rank1{
  background:linear-gradient(90deg,rgba(255,214,91,.2),transparent);
}

.rank2{
  background:linear-gradient(90deg,rgba(210,215,224,.18),transparent);
}

.rank3{
  background:linear-gradient(90deg,rgba(194,131,80,.18),transparent);
}

.searchbar{
  display:flex;
  gap:8px;
}

.searchbar input{flex:1}

.tag{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  border:1px solid var(--line);
  font-size:11px;
  font-weight:900;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:200;
  width:min(400px,calc(100vw - 36px));
  padding:14px;
  background:#171a20;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:var(--shadow);
}

#reportAnimation{
  position:fixed;
  inset:0;
  z-index:300;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(5,6,8,.88);
  backdrop-filter:blur(10px);
}

.report-animation-box{
  padding:35px;
  text-align:center;
}

.spinner{
  width:52px;
  height:52px;
  margin:auto auto 18px;
  border:4px solid #303640;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@media(max-width:780px){
  .two,.three,.admin-form{
    grid-template-columns:1fr;
  }

  .admin-window{
    grid-template-columns:1fr;
  }

  .admin-side{
    border-right:0;
    border-bottom:1px solid var(--line);
    display:flex;
    overflow:auto;
  }

  .admin-side button{
    min-width:150px;
  }

  .row-main{
    flex-direction:column;
    align-items:flex-start;
  }

  .spin-grid{
    grid-template-columns:1fr;
  }

  .plate{
    gap:7px;
    padding:14px;
  }

  .main-code{
    letter-spacing:1px;
  }
}
</style>
</head>

<script>
'use strict';

/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL =
  'https://wehiexatkhqbfcelvjnr.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_JR5bFKt15zPnzAzeripx8w___vtFpW1';

const OWNER = 'd0ntyyy';

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   ROLES
========================================================= */

const ROLES = [
  'Хелпер',
  'Модератор',
  'Старший Модератор',
  'Администратор',
  'Главный Администратор',
  'Зам. основателя',
  'Owner'
];

const ROLE_LEVEL = {
  'Игрок':0,
  'Хелпер':1,
  'Модератор':2,
  'Старший Модератор':3,
  'Администратор':4,
  'Главный Администратор':5,
  'Зам. основателя':6,
  'Owner':7
};


/* =========================================================
   PLATE LETTERS
========================================================= */

const LETTERS = [
  'А','В','Е','К','М','Н','О','Р','С','Т','Х'
];

const LATIN_MAP = {
  A:'А',
  B:'В',
  E:'Е',
  K:'К',
  M:'М',
  H:'Н',
  O:'О',
  P:'Р',
  C:'С',
  T:'Т',
  X:'Х',
  Y:'У'
};


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let authMode = 'login';
let currentPage = 'home';
let adminSection = 'users';

let users = [];
let plates = [];
let messages = [];
let reports = [];
let punishments = [];
let tags = [];
let market = [];
let promocodes = [];


/* =========================================================
   HELPERS
========================================================= */

function esc(value){
  return String(value ?? '').replace(/[&<>'"]/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    "'":'&#039;',
    '"':'&quot;'
  }[m]));
}

function now(){
  return new Date().toISOString();
}

function fmt(value){
  if(!value) return '—';

  return new Date(value).toLocaleString(
    'ru-RU',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    }
  );
}

function dateOnly(value){
  if(!value) return '—';

  return new Date(value).toLocaleDateString(
    'ru-RU'
  );
}

function toast(text,good=false){

  const el = document.getElementById('toast');

  el.textContent = text;

  el.classList.remove('hidden');

  el.style.borderColor =
    good ? '#2d6945' : '#4c3034';

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(()=>{
      el.classList.add('hidden');
    },3200);
}

function roleLevel(user){

  if(!user) return 0;

  if(String(user.nickname).toLowerCase()===OWNER)
    return 7;

  return ROLE_LEVEL[user.role] || 0;
}

function isAdmin(user=currentUser){
  return roleLevel(user) >= 1;
}

function isOwner(user=currentUser){
  return !!user &&
    (
      String(user.nickname).toLowerCase()===OWNER ||
      user.is_owner === true
    );
}

function canManageProject(user=currentUser){
  return roleLevel(user)>=4;
}

function canManageRoles(user=currentUser){
  return roleLevel(user)>=6;
}

function canManageTags(user=currentUser){
  return roleLevel(user)>=5;
}


/* =========================================================
   NORMALIZE USER
========================================================= */

function normalizeUser(u){

  if(!u) return null;

  const owner =
    String(u.nickname).toLowerCase()===OWNER ||
    !!u.is_owner;

  return {
    ...u,
    id:String(u.id),
    nickname:String(u.nickname),
    balance:Number(u.balance || 0),
    role:owner ? 'Owner' : (u.role || 'Игрок'),
    is_admin:owner || !!u.is_admin,
    is_owner:owner,
    banned:!!u.banned
  };
}


/* =========================================================
   LOAD DATABASE
========================================================= */

async function loadDatabase(){

  const [
    usersRes,
    platesRes,
    messagesRes,
    reportsRes,
    punishmentsRes,
    tagsRes,
    marketRes,
    promosRes
  ] = await Promise.all([

    sb.from('users').select('*'),

    sb.from('plates').select('*'),

    sb.from('messages').select('*'),

    sb.from('reports').select('*'),

    sb.from('punishments').select('*'),

    sb.from('tags').select('*'),

    sb.from('market').select('*'),

    sb.from('promocodes').select('*')

  ]);


  if(usersRes.error)
    throw usersRes.error;

  users = (usersRes.data || []).map(normalizeUser);

  plates = platesRes.data || [];

  messages = messagesRes.data || [];

  reports = reportsRes.data || [];

  punishments = punishmentsRes.data || [];

  tags = tagsRes.data || [];

  market = marketRes.data || [];

  promocodes = promosRes.data || [];


  const owner = users.find(
    u=>u.nickname.toLowerCase()===OWNER
  );

  if(owner){

    if(owner.role!=='Owner' ||
       !owner.is_admin ||
       !owner.is_owner){

      await sb
        .from('users')
        .update({
          role:'Owner',
          is_admin:true,
          is_owner:true
        })
        .eq('id',owner.id);

      owner.role='Owner';
      owner.is_admin=true;
      owner.is_owner=true;
    }

  }
}


/* =========================================================
   FIND USER
========================================================= */

function findUser(id){
  return users.find(
    u=>String(u.id)===String(id)
  );
}

function findUserNick(nick){
  return users.find(
    u=>u.nickname.toLowerCase()===
      String(nick).toLowerCase()
  );
}


/* =========================================================
   AUTH UI
========================================================= */

function renderAuth(){

  const box =
    document.getElementById('authForm');

  if(authMode==='login'){

    box.innerHTML = `

      <div class="field">
        <label>НИКНЕЙМ</label>
        <input

        <input

          autocomplete="current-password"

      </div>

      <button
        class="btn btn-blue"
        style="width:100%"
        onclick="login()">
        ВОЙТИ
      </button>

      <div id="authError"></div>

    `;

  }else{

    box.innerHTML = `

      <div class="field">
        <label>НИКНЕЙМ</label>
        <input
          id="authNick"
          maxlength="30"
          autocomplete="username"
          placeholder="Придумайте никнейм">
      </div>

      <div class="field">
        <label>ПАРОЛЬ</label>
        <input
          id="authPass"
          type="password"
          autocomplete="new-password"
          placeholder="Придумайте пароль">
      </div>

      <div class="field">
        <label>ПОВТОР ПАРОЛЯ</label>
        <input
          id="authPass2"
          type="password"
          autocomplete="new-password"
          placeholder="Повторите пароль">
      </div>

      <button
        class="btn btn-green"
        style="width:100%"
        onclick="register()">
        ЗАРЕГИСТРИРОВАТЬСЯ
      </button>

      <div id="authError"></div>

    `;
  }
}

document.getElementById('loginTab').onclick=()=>{
  authMode='login';
  renderAuth();
};

document.getElementById('registerTab').onclick=()=>{
  authMode='register';
  renderAuth();
};


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const nick =
    document.getElementById('authNick')
      ?.value.trim();

  const pass =
    document.getElementById('authPass')

/* =========================================================
   GENERATOR
========================================================= */

function randomLetter(){
  return LETTERS[
    Math.floor(Math.random()*LETTERS.length)
  ];
}

function randomLetters(){

  return (
    randomLetter()+
    randomLetter()+
    randomLetter()
  );
}

function randomNumbers(){

  const specials=[
    '001','007','111','222','333',
    '444','555','666','777','888',
    '999','100','500','700','900'
  ];

  if(Math.random()<.03){

    return specials[
      Math.floor(Math.random()*specials.length)
    ];
  }

  return String(
    Math.floor(Math.random()*1000)
  ).padStart(3,'0');
}

function randomRegion(){

  return String(
    Math.floor(Math.random()*1000)
  ).padStart(3,'0');
}

function rarity(letters,numbers){

  const triple =
    numbers[0]===numbers[1] &&
    numbers[1]===numbers[2];

  const mirror =
    numbers[0]===numbers[2];

  const special=[
    '001','007','100',
    '500','700','900'
  ].includes(numbers);

  const sameLetters =
    letters[0]===letters[1] &&
    letters[1]===letters[2];

  const repeatedLetters =
    letters[0]===letters[1] ||
    letters[1]===letters[2] ||
    letters[0]===letters[2];

  if(triple || special || sameLetters)
    return 'gold';

  if(mirror || repeatedLetters)
    return 'rare';

  return 'common';
}

function rarityText(r){

  if(r==='gold') return 'Золотой';
  if(r==='rare') return 'Редкий';

  return 'Обычный';
}

function generatorHTML(){

  const letters=randomLetters();
  const numbers=randomNumbers();
  const region=randomRegion();
  const r=rarity(letters,numbers);

  return {

    letters,
    numbers,
    region,
    rarity:r

  };
}

let currentSpin =
  generatorHTML();

async function buyMarket(id){

  const item =
    market.find(x=>String(x.id)===String(id));

  if(!item) return;

  const price=Number(item.price||0);

  if(currentUser.balance<price){

    toast('Недостаточно денег.');

    return;
  }

  const plateCode =
    item.plate || item.code;

  try{

    const newBalance =
      currentUser.balance-price;

    const {error:e1} =
      await sb
        .from('users')
        .update({
          balance:newBalance
        })
        .eq('id',currentUser.id);

    if(e1) throw e1;

    const {error:e2} =
      await sb
        .from('plates')
        .insert({
          user_id:Number(currentUser.id),
          plate:plateCode,
          region:item.region || '000',
          rarity:item.rarity || 'common',
          price:price
        });

    if(e2) throw e2;

    await sb
      .from('market')
      .update({active:false})
      .eq('id',item.id);

    await addMessage(
      currentUser.id,
      'Покупка номера',
      `Вы купили номер: ${plateCode}\nСтоимость: ${price.toLocaleString('ru-RU')}\nПродавец: ${findUser(item.seller_id)?.nickname || '—'}`
    );

    toast('Номер куплен.',true);

    await reloadUserData();

    renderPage();

  }catch(e){

    toast('Ошибка покупки: '+e.message);
  }
}

/* =========================================================
   GIVE NUMBER
========================================================= */

function parsePlate(value){

  let s =
    String(value || '')
      .trim()
      .toUpperCase();

  s=s.replace(/\|/g,' ');
  s=s.replace(/\s+/g,' ');

  const parts=s.split(' ');

  if(parts.length!==2)
    return null;

  let letters =
    parts[0]
      .split('')
      .map(x=>LATIN_MAP[x]||x)
      .join('');

  const numbers=parts[0].slice(3);

  const region=parts[1];

  /*
    Correct format:
    Е777КХ 777

    letters = ЕКХ
    numbers = 777
  */

  const match =
    parts[0].match(
      /^([АВЕКМНОРСТХ]{1})(\d{3})([АВЕКМНОРСТХ]{2})$/
    );

  if(!match)
    return null;

  letters=
    match[1]+
    match[3];

  const nums=match[2];

  if(!/^\d{3}$/.test(region))
    return null;

  return {
    code:`${letters[0]}${nums}${letters.slice(1)} ${region}`,
    letters,
    numbers:nums,
    region
  };
}


async function giveNumber(){

  if(roleLevel()<4)
    return;

  const raw =
    document.getElementById('givePlate')
      .value;

  const parsed=parsePlate(raw);

  if(!parsed){

    toast(
      'Неверный формат. Пример: Е777КХ 777'
    );

    return;
  }

  const target =
    findUser(
      document.getElementById('giveUser').value
    );

  if(!target){

    toast('Пользователь не найден.');

    return;
  }

  const duplicate =
    plates.some(
      p=>
        String(p.plate||'')
          .replace(/\s/g,'')
          .toUpperCase()
        ===
        parsed.code
          .replace(/\s/g,'')
          .toUpperCase()
    );

  if(duplicate){

    toast('Такой номер уже существует.');

    return;
  }

  try{

    const r =
      rarity(
        parsed.letters,
        parsed.numbers
      );

    const {data,error} =
      await sb
        .from('plates')
        .insert({
          user_id:Number(target.id),
          plate:parsed.code,
          region:parsed.region,
          rarity:r,
          price:0
        })
        .select()
        .single();

    if(error) throw error;

    await addMessage(
      target.id,
      'Вам выдан номер',
      `Номер: ${parsed.code}\nРедкость: ${rarityText(r)}\nАдминистратор: ${currentUser.nickname}`
    );

      `Номер ${parsed.code} выдан ${target.nickname}.`,
      true
    );

    await reloadUserData();

}

        .from('users')

        '<div class="muted">Тегов пока нет.</div>'
      }

    </div>

  </div>

  `;
}


async function createTag(){

  const name =
    document
      .getElementById('tagName')
      .value
      .trim();

  const color =
    document
      .getElementById('tagColor')
      .value;

  if(!name){

    toast('Введите название.');

    return;
  }

  try{

    const {error} =
      await sb
        .from('tags')
        .insert({
          user_id:null,
          tag:name,
          color:color
        });

    if(error) throw error;

    toast(
      'Тег создан.',
      true
    );

    await reloadUserData();

    renderAdmin();

  }catch(e){

    toast('Ошибка: '+e.message);
  }
}


async function giveTag(){

  const userId =
    document
      .getElementById('tagUser')
      .value;

  const tagId =
    document
      .getElementById('tagSelect')
      .value;

  const source =
    tags.find(
      t=>String(t.id)===String(tagId)
    );

  if(!source){

    toast('Тег не найден.');

    return;
  }

  try{

    const {error} =
      await sb
        .from('tags')
        .insert({
          user_id:Number(userId),
          tag:source.tag,
          color:source.color
        });

    if(error) throw error;

    await addMessage(
      userId,
      'Вам выдан тег',
      `Тег: ${source.tag}\nАдминистратор: ${currentUser.nickname}`
    );

    toast(
      'Тег выдан.',
      true
    );

    await reloadUserData();

    renderAdmin();

  }catch(e){

    toast('Ошибка: '+e.message);
  }
}


/* =========================================================
   ADMIN REPORTS
========================================================= */

function adminReports(){

  if(!isAdmin())
    return '<div class="notice muted">Нет доступа.</div>';

  return `

  <div>

    <div class="section-title">
      РЕПОРТЫ
    </div>

    ${
      reports
        .slice()
        .sort(
          (a,b)=>
            new Date(b.created_at)-
            new Date(a.created_at)
        )
        .map(adminReportCard)
        .join('')
      ||
      '<div class="notice muted">Репортов пока нет.</div>'
    }

  </div>

  `;
}


function adminReportCard(r){

  return `

  <div class="admin-report">

    <div class="row-main">

      <div>

        <b>
          Жалоба на:
          ${esc(r.nickname || '—')}
        </b>

        <div class="muted small">
          От:
          ${esc(findUser(r.user_id)?.nickname || '—')}
          · ${fmt(r.created_at)}
        </div>

      </div>

      <span class="badge ${
        r.status==='Решён'
        ?'green'
        :'blue'
      }">
        ${esc(r.status || 'Новый')}
      </span>

    </div>

    <div style="margin-top:12px">
      ${esc(r.text || '')}
    </div>

    ${
      r.admin_answer
      ?
      `<div class="answer-box">
        <b>Ответ:</b>
        <div style="margin-top:5px">
          ${esc(r.admin_answer)}
        </div>
        <div class="muted small" style="margin-top:7px">
          Администратор:
          ${esc(r.answered_by || '—')}
        </div>
      </div>`
      :
      ''
    }

    <div class="field">

      <label>ОТВЕТ</label>

      <textarea
        id="answer_${esc(r.id)}"
        placeholder="Введите ответ пользователю"></textarea>

    </div>

    <div class="stack">

      <button
        class="btn btn-green"
        onclick="answerReport('${esc(r.id)}')">

        ОТВЕТИТЬ

      </button>

      <button
        class="btn btn-red"
        onclick="muteReport('${esc(r.id)}')">

        МУТ РЕПОРТА

      </button>

    </div>

  </div>

  `;
}


/* =========================================================
   REPORT ANSWER
========================================================= */

async function answerReport(id){

  const r =
    reports.find(
      x=>String(x.id)===String(id)
    );

  if(!r) return;

  const answer =
    document
      .getElementById('answer_'+id)
      ?.value.trim();

  if(!answer){

    toast('Введите ответ.');

    return;
  }

  try{

    const {error} =
      await sb
        .from('reports')
        .update({
          admin_answer:answer,
          answered_by:currentUser.nickname,
          answered_at:now(),
          status:'Решён',
          muted:false
        })
        .eq('id',id);

    if(error) throw error;

    await addMessage(
      r.user_id,
      'Ответ на жалобу',
      `Администратор: ${currentUser.nickname}\nОтвет: ${answer}`
    );

    toast(
      'Ответ отправлен пользователю.',
      true
    );

    await reloadUserData();

    renderAdmin();

  }catch(e){

    toast('Ошибка: '+e.message);
  }
}


async function muteReport(id){

  try{

    const {error} =
      await sb
        .from('reports')
        .update({
          status:'Замьючен',
          muted:true
        })
        .eq('id',id);

    if(error) throw error;

    toast(
      'Репорт замьючен.',
      true
    );

    await reloadUserData();

    renderAdmin();

  }catch(e){

    toast('Ошибка: '+e.message);
  }
}


/* =========================================================
   ADMIN PUNISHMENTS
========================================================= */

function adminPunishments(){

  return `

  <div>

    <div class="section-title">
      НАКАЗАНИЯ
    </div>

    <div class="admin-form">

      <div class="field">

        <label>ПОЛЬЗОВАТЕЛЬ</label>

        <select id="punUser">

          ${users.map(u=>`

            <option value="${esc(u.id)}">
              ${esc(u.nickname)}
            </option>

          `).join('')}

        </select>

      </div>

      <div class="field">

        <label>ТИП</label>

        <select id="punType">

          <option value="warning">
            Предупреждение
          </option>

          <option value="strike">
            Выговор
          </option>

          <option value="ban">
            Бан
          </option>

        </select>

      </div>

      <div class="field full">

        <label>ПРИЧИНА</label>

        <input
          id="punReason"
          placeholder="Причина наказания">

      </div>

      <div class="full">

        <button
          class="btn btn-red"
          onclick="givePunishment()">

          ВЫДАТЬ НАКАЗАНИЕ

        </button>

      </div>

    </div>

    <div class="hr"></div>

    <div class="list">

      ${
        punishments
          .slice()
          .reverse()
          .map(p=>`

            <div class="row">

              <div class="row-main">

                <div>

                  <b>
                    ${
                      p.type==='warning'
                      ?'Предупреждение'
                      :p.type==='strike'
                      ?'Выговор'
                      :'Бан'
                    }
                  </b>

                  <div class="muted small">

                    ${esc(
                      findUser(p.user_id)?.nickname
                      || '—'
                    )}

                    ·
                    ${esc(p.reason || '—')}

                  </div>

                </div>

                <span class="badge red">
                  ${esc(p.status || 'Активно')}
                </span>

              </div>

              <div class="muted small"
                   style="margin-top:8px">

                Администратор:
                ${esc(p.issued_by || '—')}

                ·
                ${fmt(p.created_at)}

              </div>

            </div>

          `).join('')
        ||
        '<div class="muted">Наказаний нет.</div>'
      }

    </div>

  </div>

  `;
}


async function givePunishment(){

  if(roleLevel()<1) return;

  const userId =
    document.getElementById('punUser').value;

  const type =
    document.getElementById('punType').value;

  const reason =
    document
      .getElementById('punReason')
      .value
      .trim();

  if(!reason){

    toast('Введите причину.');

    return;
  }

  const target=findUser(userId);

  if(!target) return;

  try{

    const {error} =
      await sb
        .from('punishments')
        .insert({
          user_id:Number(userId),
          type:type,
          reason:reason,
          status:'Активно',
          issued_by:currentUser.nickname
        });

    if(error) throw error;

    if(type==='ban'){

      await sb
        .from('users')
        .update({
          banned:true
        })
        .eq('id',userId);
    }

    await addMessage(
      userId,
      'Наказание',
      `Тип: ${
        type==='warning'
        ?'Предупреждение'
        :type==='strike'
        ?'Выговор'
        :'Бан'
      }\nПричина: ${reason}\nАдминистратор: ${currentUser.nickname}`
    );

    toast(
      'Наказание выдано.',
      true
    );

    await reloadUserData();

    renderAdmin();

  }catch(e){

    toast('Ошибка: '+e.message);
  }
}


/* =========================================================
   BAN
========================================================= */

function renderBan(){

  if(!currentUser) return;

  if(currentUser.banned){

    document.body.innerHTML=`

      <div class="page">

        <div class="card"
             style="max-width:600px;margin:15vh auto;padding:30px;text-align:center">

          <h1 style="color:#ff6973">
            АККАУНТ ЗАБЛОКИРОВАН
          </h1>

          <p class="muted">
            Доступ к аккаунту ограничен администрацией.
          </p>

          <button
            class="btn"
            onclick="logout()">
            ВЫЙТИ
          </button>

        </div>

      </div>

    `;

  }
}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  sessionStorage.removeItem(
    'd0ntyyy_user_id'
  );

  currentUser=null;

  document
    .getElementById('appView')
    .classList.add('hidden');

  document
    .getElementById('authView')
    .classList.remove('hidden');

  authMode='login';

  renderAuth();

}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

  renderAuth();

  try{

    await loadDatabase();

    const saved =
      sessionStorage.getItem(
        'd0ntyyy_user_id'
      );

    if(saved){

      const user =
        findUser(saved);

      if(user){

        currentUser=user;

        await openApp();

        return;
      }
    }

  }catch(e){

    console.error(e);

    const box =
      document.getElementById('authForm');

    box.insertAdjacentHTML(
      'beforeend',
      `<div class="error">
        Ошибка подключения к базе данных:
        ${esc(e.message)}
      </div>`
    );
  }
}


boot();


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(async()=>{

  if(!currentUser) return;

  try{

    await loadDatabase();

    const fresh =
      findUser(currentUser.id);

    if(fresh){

      currentUser=fresh;

      if(currentPage==='messages' ||
         currentPage==='reports' ||
         currentPage==='inventory'){

        renderPage();
      }

      renderBan();

    }

  }catch(e){

    console.warn(
      'Автообновление:',
      e.message
    );
  }

},5000);

</script>
