<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>D0NTYYY — License Plates</title>

<style>
:root{
  --bg:#0d0e10;
  --panel:#131519;
  --panel2:#181a1f;
  --line:#292d34;
  --text:#f2f3f5;
  --muted:#8d939c;
  --green:#43d17b;
  --red:#ff4d5a;
  --blue:#6ea8ff;
  --gold:#ffd65b;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#0a0b0d,#101216 70%,#0b0c0f);
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
}

.hidden{display:none!important}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 18px;
  background:rgba(10,11,13,.86);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.brand{
  font-weight:900;
  letter-spacing:1px;
  margin-right:12px;
}

.nav{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.nav button,.ghost{
  border:1px solid var(--line);
  background:#111318;
  color:#d8dbe0;
  padding:9px 12px;
  border-radius:9px;
}

.nav button.active,.nav button:hover,.ghost:hover{
  background:#1c2026;
  color:#fff;
}

.spacer{flex:1}

.page{
  max-width:1120px;
  margin:auto;
  padding:24px 18px 60px;
}

.card{
  background:rgba(19,21,25,.88);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 24px 80px rgba(0,0,0,.45);
}

.auth{
  max-width:420px;
  margin:10vh auto 0;
  padding:24px;
}

.tabs{
  display:flex;
  gap:6px;
  margin-bottom:18px;
}

.tabs button{flex:1}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin:12px 0;
}

.field label{
  font-size:11px;
  color:var(--muted);
  font-weight:800;
  letter-spacing:.8px;
}

.field input,
.field select,
.field textarea,
.input{
  width:100%;
  background:#0f1115;
  color:#fff;
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px 12px;
  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#555d68;
}

.btn{
  border:1px solid var(--line);
  background:#1a1e24;
  color:#fff;
  padding:11px 14px;
  border-radius:9px;
}

.btn:hover{background:#242931}
.btn-green{background:#173a27;border-color:#275f3e}
.btn-red{background:#3b181c;border-color:#643035}
.btn-blue{background:#17273f;border-color:#294d80}
.btn-gold{background:#3b3217;border-color:#6c5b22}

.stack{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.error{color:#ff717b;font-size:13px;margin-top:8px}
.ok{color:#68dc95;font-size:13px;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.center{text-align:center}

.hero{
  padding:32px;
  text-align:center;
}

.hero h1{
  margin:0 0 8px;
  font-size:28px;
}

.balance{
  text-align:center;
  margin:12px 0;
  color:#c9cdd3;
}

.plate-wrap{
  display:flex;
  justify-content:center;
  margin:25px 0 15px;
}

.plate{
  width:min(620px,94vw);
  min-height:124px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:18px 24px;
  border-radius:18px;
  background:linear-gradient(180deg,#f7f7f7,#cfd2d6);
  color:#111;
  box-shadow:
    0 7px 30px rgba(255,255,255,.07),
    inset 0 2px 0 rgba(255,255,255,.95),
    inset 0 -3px 0 rgba(0,0,0,.15);
  border:4px solid #25272b;
  position:relative;
}

.plate .main-code{
  font-weight:1000;
  font-size:clamp(40px,7vw,72px);
  letter-spacing:4px;
}

.plate .region{
  font-weight:900;
  font-size:clamp(18px,3vw,28px);
  align-self:flex-start;
  margin-top:20px;
  border-left:2px solid #999;
  padding-left:12px;
  text-align:center;
}

.plate.gold{
  box-shadow:
    0 0 0 2px rgba(255,214,91,.15),
    0 0 40px rgba(255,196,40,.35),
    inset 0 2px 0 #fff;
}

.plate.rare{
  box-shadow:
    0 0 0 2px rgba(110,168,255,.14),
    0 0 34px rgba(90,140,255,.28),
    inset 0 2px 0 #fff;
}

.spin-area{
  padding:24px;
}

.spin-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.spin-grid button{
  min-height:58px;
  font-weight:900;
  letter-spacing:1px;
  border:1px solid var(--line);
  background:#15181d;
  color:#fff;
  border-radius:11px;
}

.spin-grid button:hover{
  background:#20242a;
}

.big-value{
  text-align:center;
  font-size:28px;
  font-weight:1000;
  margin:12px 0;
}

.info-row{
  display:flex;
  justify-content:center;
  gap:22px;
  flex-wrap:wrap;
  color:#a7adb6;
  font-size:13px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.row{
  padding:15px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#111318;
}

.row-main{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:center;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:999px;
  border:1px solid var(--line);
  font-size:11px;
}

.badge.green{
  color:#71dfa0;
  background:#10291b;
}

.badge.red{
  color:#ff8a91;
  background:#301317;
}

.badge.gold{
  color:#ffe184;
  background:#30270f;
}

.badge.blue{
  color:#9fc3ff;
  background:#10223b;
}

.market-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:12px;
}

.market-card{
  padding:14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#111318;
}

.market-code{
  font-size:25px;
  font-weight:1000;
}

.price{
  font-size:20px;
  font-weight:900;
  margin:10px 0;
}

.inventory-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#111318;
}

.notice{
  padding:13px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#111318;
}

.msg-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.msg{
  padding:14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#111318;
}

.msg.unread{
  border-color:#49515c;
}

.msg .title{
  font-weight:900;
  margin-bottom:8px;
}

.top-table{
  width:100%;
  border-collapse:collapse;
}

.top-table th,
.top-table td{
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.rank1{
  background:linear-gradient(90deg,rgba(255,214,91,.20),transparent);
}

.rank2{
  background:linear-gradient(90deg,rgba(210,215,224,.18),transparent);
}

.rank3{
  background:linear-gradient(90deg,rgba(194,131,80,.18),transparent);
}

.admin-overlay,
.ban-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(3,4,5,.78);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.admin-window{
  width:min(1400px,98vw);
  max-height:95vh;
  display:grid;
  grid-template-columns:270px 1fr;
  background:#0f1115;
  border:1px solid #30343b;
  border-radius:22px;
  overflow:hidden;
}

.admin-side{
  padding:18px;
  border-right:1px solid var(--line);
  background:#0b0d10;
}

.admin-side button{
  width:100%;
  text-align:left;
  margin-bottom:7px;
  padding:13px 15px;
  font-weight:800;
}

.admin-side button.active{
  background:#191d23;
}

.admin-content{
  padding:28px;
  overflow:auto;
}

.admin-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.admin-form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.full{
  grid-column:1/-1;
}

.metric{
  padding:17px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#111318;
}

.metric b{
  display:block;
  font-size:24px;
  margin-top:5px;
}

.admin-stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.tag-preview{
  display:inline-flex;
  align-items:center;
  padding:5px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:900;
}

.hr{
  height:1px;
  background:var(--line);
  margin:16px 0;
}

.ban-box{
  width:min(680px,95vw);
  background:#111318;
  border:1px solid #48282d;
  border-radius:18px;
  padding:28px;
  text-align:center;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:150;
  width:min(390px,calc(100vw - 36px));
  padding:14px;
  border:1px solid var(--line);
  background:#15181d;
  border-radius:12px;
}

@media(max-width:780px){
  .spin-grid,
  .admin-form,
  .admin-stat-grid{
    grid-template-columns:1fr;
  }

  .admin-window{
    grid-template-columns:1fr;
    max-height:95vh;
  }

  .admin-side{
    border-right:0;
    border-bottom:1px solid var(--line);
    display:flex;
    overflow:auto;
  }

  .admin-side button{
    min-width:145px;
  }

  .row-main{
    flex-direction:column;
    align-items:flex-start;
  }

  .plate{
    gap:7px;
    padding:14px;
  }

  .plate .main-code{
    letter-spacing:1px;
  }
}
</style>
</head>

<body>

<div id="authView" class="page">

          <div style="font-size:20px;font-weight:900">

</div>

<div id="toast" class="toast hidden"></div>

<script>

'use strict';

const SUPABASE_URL =
  'https://wehiexatkhqbfcelvjnr.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_JR5bFKt15zPnzAzeripx8w___vtFpW1';

const OWNER = 'd0ntyyy';

const OWNER_PASSWORD = 'Semen20151';

const TABLES = [
  'users',
  'market',
  'messages',
  'punishments',
  'tags',
  'plates',
  'reports',
  'promocodes'
];

const LETTERS = [
  'А','В','Е','К','М','Н','О','Р','С','Т','Х'
];

const ROLES = {
  player:'Игрок',
  helper:'Хелпер',
  moderator:'Модератор',
  senior_moderator:'Ст.Модератор',
  administrator:'Администратор',
  chief_administrator:'Главный Администратор',
  deputy_founder:'Зам. основателя',
  owner:'Owner'
};

let currentUser = null;
let currentPage = 'spin';

let spinLettersValue = 'О';
let spinNumbersValue = '00';
let spinRegionValue = '000';

let authMode = 'login';

function esc(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function toast(text){
  const el=document.getElementById('toast');
  el.textContent=text;
  el.classList.remove('hidden');

  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>{
    el.classList.add('hidden');
  },3000);
}

async function api(table,method='GET',query='',body=null){

  const options={
    method,
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json',
      Prefer:method==='GET'
        ?'return=representation'
        :'return=representation'
    }
  };

  if(body!==null){
    options.body=JSON.stringify(body);
  }

  const response=await fetch(
    SUPABASE_URL+
    '/rest/v1/'+table+
    (query?'?'+query:''),
    options
  );

  const text=await response.text();

  if(!response.ok){
    throw new Error(text||('HTTP '+response.status));
  }

  return text ? JSON.parse(text) : [];
}

async function allUsers(){
  return api('users','GET','select=*&order=id.asc');
}

async function findUser(nickname){

  const rows=await api(
    'users',
    'GET',
    'nickname=eq.'+
    encodeURIComponent(nickname)+
    '&select=*'
  );

  return rows[0]||null;
}

function setAuth(mode){
  authMode=mode;
  renderAuth();
}

function renderAuth(){

  const form=document.getElementById('authForm');

  if(authMode==='login'){

    form.innerHTML=`
      <div class="field">
        <label>НИКНЕЙМ</label>
        <input id="authNick" placeholder="Введите никнейм">
      </div>

      <div class="field">
        <label>ПАРОЛЬ</label>
        <input id="authPassword" type="password" placeholder="Введите пароль">
      </div>

      <button class="btn btn-blue" style="width:100%"
        onclick="login()">
        ВОЙТИ
      </button>

      <div id="authMsg"></div>
    `;

  }else{

    form.innerHTML=`
      <div class="field">
        <label>НИКНЕЙМ</label>
        <input id="authNick" placeholder="Придумайте никнейм">
      </div>

      <div class="field">
        <label>ПАРОЛЬ</label>
        <input id="authPassword" type="password" placeholder="Придумайте пароль">
      </div>

      <button class="btn btn-green" style="width:100%"
        onclick="register()">
        ЗАРЕГИСТРИРОВАТЬСЯ
      </button>

      <div id="authMsg"></div>
    `;
  }
}

async function login(){

  const nickname=
    document.getElementById('authNick').value.trim();

  const password=
    document.getElementById('authPassword').value;

  const msg=document.getElementById('authMsg');

  if(!nickname||!password){
    msg.innerHTML='<div class="error">Заполни все поля.</div>';
    return;
  }

  try{

    const user=await findUser(nickname);

    if(!user){
      msg.innerHTML='<div class="error">Пользователь не найден.</div>';
      return;
    }

    if(user.password!==password){
      msg.innerHTML='<div class="error">Неверный пароль.</div>';
      return;
    }

    if(user.banned){
      showBan(user);
      return;
    }

    currentUser=user;

    localStorage.setItem(
      'd0ntyyy_license_session',
      String(user.id)
    );

    /*
      Каждый вход начинается с
      О00ОО / 000.
      Этот номер является только
      визуальным шаблоном и купить его нельзя.
    */

    spinLettersValue='О';
    spinNumbersValue='00';
    spinRegionValue='000';

    await refreshUser();

    openApp();

  }catch(error){

    msg.innerHTML=
      '<div class="error">'+
      esc(error.message)+
      '</div>';
  }
}

async function register(){

  const nickname=
    document.getElementById('authNick').value.trim();

  const password=
    document.getElementById('authPassword').value;

  const msg=document.getElementById('authMsg');

  if(nickname.length<3){
    msg.innerHTML=
      '<div class="error">Минимум 3 символа в никнейме.</div>';
    return;
  }

  if(password.length<4){
    msg.innerHTML=
      '<div class="error">Минимум 4 символа в пароле.</div>';
    return;
  }

  try{

    const existing=await findUser(nickname);

    if(existing){
      msg.innerHTML=
        '<div class="error">Такой никнейм уже занят.</div>';
      return;
    }

    const rows=await api(
      'users',
      'POST',
      '',
      {
        nickname,
        password,
        balance:100000,
        is_admin:false,
        is_owner:false,
        banned:false,
        role:'Игрок'
      }
    );

    currentUser=rows[0];

    localStorage.setItem(
      'd0ntyyy_license_session',
      String(currentUser.id)
    );

    spinLettersValue='О';
    spinNumbersValue='00';
    spinRegionValue='000';

    openApp();

  }catch(error){

    msg.innerHTML=
      '<div class="error">'+
      esc(error.message)+
      '</div>';
  }
}

async function refreshUser(){

  if(!currentUser)return;

  const rows=await api(
    'users',
    'GET',
    'id=eq.'+
    encodeURIComponent(currentUser.id)+
    '&select=*'
  );

  if(rows[0]){
    currentUser=rows[0];
  }

  if(currentUser.banned){
    showBan(currentUser);
  }
}

async function restoreSession(){

  const id=localStorage.getItem(
    'd0ntyyy_license_session'
  );

  if(!id)return;

  try{

    const rows=await api(
      'users',
      'GET',
      'id=eq.'+
      encodeURIComponent(id)+
      '&select=*'
    );

    if(!rows[0])return;

    currentUser=rows[0];

    if(currentUser.banned){
      showBan(currentUser);
      return;
    }

    spinLettersValue='О';
    spinNumbersValue='00';
    spinRegionValue='000';

    openApp();

  }catch(error){
    console.error(error);
  }
}

function logout(){

  localStorage.removeItem(
    'd0ntyyy_license_session'
  );

  currentUser=null;

  document.getElementById('appView')
    .classList.add('hidden');

  document.getElementById('authView')
    .classList.remove('hidden');

  renderAuth();
}

function openApp(){

  document.getElementById('authView')
    .classList.add('hidden');

  document.getElementById('appView')
    .classList.remove('hidden');

  renderNav();
  showPage(currentPage);
}

function renderNav(){

  const nav=document.getElementById('nav');

  const items=[
    ['spin','Крутилка'],
    ['inventory','Инвентарь'],
    ['market','Магазин'],
    ['leaders','Топ'],
    ['promo','Промокоды'],
    ['reports','Репорты'],
    ['messages','Сообщения'],
    ['punishments','Наказания']
  ];

  if(currentUser &&
    (currentUser.is_admin||
     currentUser.is_owner||
     currentUser.nickname.toLowerCase()===OWNER)
  ){
    items.push(['admin','Админка']);
  }

  nav.innerHTML=items.map(
    x=>`
      <button
        class="${currentPage===x[0]?'active':''}"
        onclick="showPage('${x[0]}')">
        ${x[1]}
      </button>
    `
  ).join('');
}

async function showPage(page){

  currentPage=page;

  renderNav();

  const root=document.getElementById('pages');

  if(page==='spin'){
    root.innerHTML=spinPage();
    updatePlate();
    return;
  }

  if(page==='inventory'){
    await inventoryPage();
    return;
  }

  if(page==='market'){
    await marketPage();
    return;
  }

  if(page==='leaders'){
    await leadersPage();
    return;
  }

  if(page==='promo'){
    promoPage();
    return;
  }

  if(page==='reports'){
    reportsPage();
    return;
  }

  if(page==='messages'){
    await messagesPage();
    return;
  }

  if(page==='punishments'){
    await punishmentsPage();
    return;
  }

  if(page==='admin'){
    openAdmin();
  }
}

function spinPage(){

  return `
  <div class="page">

    <div class="card">

      <div class="spin-area">

function randomLetter(){
  return LETTERS[
    Math.floor(Math.random()*LETTERS.length)
  ];
}

function randomLetters(){

  spinLettersValue=
    randomLetter()+
    randomLetter()+
    randomLetter();

  updatePlate();
}

function randomNumbers(){

  spinNumbersValue=
    String(Math.floor(Math.random()*1000))
      .padStart(3,'0')
      .slice(0,3);

  updatePlate();
}

function spinLetters(){

  randomLetters();
  toast('Буквы прокручены');
}

function spinNumbers(){

  randomNumbers();
  toast('Цифры прокручены');
}

function spinRegion(){

  spinRegionValue=
    String(Math.floor(Math.random()*1000))
      .padStart(3,'0');

  updatePlate();
  toast('Регион прокручен');
}

function isRare(code){

  const digits=code.match(/\d+/)?.[0]||'';

  if(
    digits==='777'||
    digits==='001'||
    digits==='007'||
    digits==='111'||
    digits==='555'||
    digits==='999'
  ){
    return true;
  }

  if(
    code[0]===code[code.length-1] &&
    Math.random()<0.08
  ){
    return true;
  }

  return false;
}

function rarityOf(code){

  if(
    code==='Е777КХ'||
    code==='А777АА'||
    code==='Х777ХХ'
  ){
    return 'gold';
  }

  if(isRare(code)){
    return 'rare';
  }

  return 'common';
}

function priceForRarity(rarity){

  if(rarity==='gold'){
    return '100000000000';
  }

  if(rarity==='rare'){
    return '50000000';
  }

  return '100000';
}

function updatePlate(){

  const code=
    spinLettersValue+
    spinNumbersValue;

  const region=
    spinRegionValue;

  const codeEl=
    document.getElementById('plateCode');

  const regionEl=
    document.getElementById('plateRegion');

  const letterEl=
    document.getElementById('letterValue');

  const numberEl=
    document.getElementById('numberValue');

  const regionValueEl=
    document.getElementById('regionValue');

  if(!codeEl)return;

  codeEl.textContent=code;
  regionEl.textContent=region;

  letterEl.textContent=spinLettersValue;
  numberEl.textContent=spinNumbersValue;
  regionValueEl.textContent=region;

  const rarity=rarityOf(code);

  document.getElementById('spinRarity').textContent=
    rarity==='gold'
      ?'ЗОЛОТОЙ'
      :rarity==='rare'
        ?'РЕДКИЙ'
        :'ОБЫЧНЫЙ';

  document.getElementById('spinPrice').textContent=
    '₽ '+formatMoney(priceForRarity(rarity));

  const plate=document.getElementById('platePreview');

  plate.classList.remove('gold','rare');

  if(rarity==='gold')plate.classList.add('gold');
  if(rarity==='rare')plate.classList.add('rare');
}

function formatMoney(value){

  try{
    return BigInt(String(value)).toLocaleString('ru-RU');
  }catch{
    return String(value);
  }
}

function validPlaceholder(code,region){

  return code==='О00ОО' && region==='000';
}

async function buyCurrentPlate(){

  if(!currentUser)return;

  const code=
    spinLettersValue+
    spinNumbersValue;

  const region=spinRegionValue;

  if(validPlaceholder(code,region)){
    toast('Шаблон О00ОО / 000 нельзя купить.');
    return;
  }

  try{

    const existing=await api(
      'plates',
      'GET',
      'plate=eq.'+
      encodeURIComponent(code)+
      '&region=eq.'+
      encodeURIComponent(region)+
      '&select=id'
    );

    if(existing.length){
      toast('Этот номер уже куплен.');
      return;
    }

    const rarity=rarityOf(code);
    const price=priceForRarity(rarity);

    let balance=BigInt(
      String(currentUser.balance||0)
    );

    const cost=BigInt(price);

    if(balance<cost){
      toast('Недостаточно денег.');
      return;
    }

    balance-=cost;

    await api(
      'users',
      'PATCH',
      'id=eq.'+currentUser.id,
      {balance:balance.toString()}
    );

    await api(
      'plates',
      'POST',
      '',
      {
        user_id:currentUser.id,
        plate:code,
        region,
        rarity,
        price:price
      }
    );

    currentUser.balance=balance.toString();

    toast('Номер куплен: '+code+' / '+region);

    await showPage('inventory');

  }catch(error){

    toast('Ошибка: '+error.message);
  }
}

async function buyMarket(id){

  try{

    const rows=await api(
      'market',
      'GET',
      'id=eq.'+id+
      '&select=*'
    );

    const item=rows[0];

    if(!item){
      toast('Номер уже продан.');
      return;
    }

    if(item.seller_id===currentUser.id){
      toast('Нельзя купить свой номер.');
      return;
    }

    const balance=BigInt(
      String(currentUser.balance||0)
    );

    const price=BigInt(
      String(item.price)
    );

    if(balance<price){
      toast('Недостаточно денег.');
      return;
    }

    const sellerRows=await api(
      'users',
      'GET',
      'id=eq.'+item.seller_id+
      '&select=*'
    );

    const seller=sellerRows[0];

    if(!seller){
      toast('Продавец не найден.');
      return;
    }

    const newBalance=balance-price;

    const sellerBalance=
      BigInt(String(seller.balance||0))+price;

    await api(
      'users',
      'PATCH',
      'id=eq.'+currentUser.id,
      {balance:newBalance.toString()}
    );

    await api(
      'users',
      'PATCH',
      'id=eq.'+seller.id,
      {balance:sellerBalance.toString()}
    );

    await api(
      'plates',
      'POST',
      '',
      {
        user_id:currentUser.id,
        plate:item.plate,
        region:item.region,
        rarity:item.rarity,
        price:item.price
      }
    );

    await api(
      'market',
      'DELETE',
      'id=eq.'+id
    );

    await sendMessage(
      seller.id,
      'Продажа номера',
      'Ваш номер '+item.plate+
      ' / '+item.region+
      ' был продан за ₽'+formatMoney(item.price)+'.'
    );

    currentUser.balance=
      newBalance.toString();

    toast('Номер куплен.');

    marketPage();

  }catch(error){

    toast('Ошибка: '+error.message);
  }
}

async function adminRoles(content){

  const users=await allUsers();

  content.innerHTML=`
    <div class="section-title">
      НАЗНАЧЕНИЕ РОЛЕЙ
    </div>

    <div class="list">

      ${users.map(u=>`

        <div class="row">

          <b>${esc(u.nickname)}</b>

          <div class="field">
            <label>РОЛЬ</label>

            <select id="role_${u.id}">

              ${Object.entries(ROLES)
                .map(([key,name])=>`
                  <option
                    value="${key}"
                    ${
                      (u.role||'Игрок')===name
                      ?'selected':''
                    }>
                    ${name}
                  </option>
                `).join('')}

            </select>
          </div>

          <button
            class="btn btn-green"
            onclick="setRole(${u.id})">
            НАЗНАЧИТЬ
          </button>

        </div>

      `).join('')}

    </div>
  `;
}

async function setRole(userId){

  if(!isOwner()){
    toast('Назначать роли может владелец.');
    return;
  }

  const select=
    document.getElementById(
      'role_'+userId
    );

  const role=select.value;

  const roleName=ROLES[role];

  const isStaff=role!=='player';

  try{

    await api(
      'users',
      'PATCH',
      'id=eq.'+userId,
      {
        role:roleName,
        is_admin:isStaff,
        is_owner:role==='owner'
      }
    );

    await sendMessage(
      userId,
      'Изменение должности',
      'Вас назначили на '+roleName+'.'
    );

    toast(
      'Пользователь назначен: '+roleName
    );

    renderAdmin('roles');

  }catch(error){

    toast('Ошибка: '+error.message);
  }
}

  try{

    await api(
      'plates',
      'POST',

      {

        plate:code,

        rarity:rarityOf(code),

async function applyPunishment(){

  const userId=
    document.getElementById('punUser').value;

  const type=
    document.getElementById('punType').value;

  const reason=
    document.getElementById('punReason')
      .value.trim();

  try{

    if(type==='Разбан'){

      await api(
        'users',
        'PATCH',
        'id=eq.'+userId,
        {banned:false}
      );

      await sendMessage(
        userId,
        'Вас разбанили',
        'С вас снята блокировка.'
      );

      toast('Игрок разбанен.');

      return;
    }

    await api(
      'punishments',
      'POST',
      '',
      {
        user_id:userId,
        type,
        reason,
        status:'Активно',
        issued_by:currentUser.id
      }
    );

    if(type==='Бан'){

      await api(
        'users',
        'PATCH',
        'id=eq.'+userId,
        {banned:true}
      );
    }

    await sendMessage(
      userId,
      'Вам выдали наказание',
      'Наказание: '+type+
      '\\nПричина: '+
      (reason||'Не указана')+'.'
    );

    toast('Наказание применено.');

  }catch(error){

    toast('Ошибка: '+error.message);
  }
}
