<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>D0NTYYY — License Plates</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#090a0c;color:#eee}
body{overflow-x:hidden}
button,input,textarea,select{font:inherit}

:root{
  --bg:#090a0c;
  --panel:rgba(20,22,26,.88);
  --panel2:rgba(28,30,35,.92);
  --border:rgba(255,255,255,.08);
  --muted:#8d929b;
  --text:#f1f1f1;
  --accent:#657181;
  --green:#4caf75;
  --red:#d95c5c;
  --gold:#d8ad46;
}

.app{min-height:100vh;display:flex}

.sidebar{
  width:245px;
  min-height:100vh;
  position:fixed;
  left:0;
  top:0;
  padding:22px 14px;
  background:rgba(10,11,13,.94);
  border-right:1px solid var(--border);
  backdrop-filter:blur(18px);
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:1px;
  padding:8px 12px 25px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:#aeb2b9;
  text-align:left;
  padding:12px 13px;
  border-radius:10px;
  cursor:pointer;
  transition:.18s;
}

.nav button:hover,
.nav button.active{
  background:rgba(255,255,255,.055);
  color:#fff;
  border-color:var(--border);
}

.nav-count{
  float:right;
  min-width:20px;
  padding:2px 6px;
  border-radius:8px;
  background:#a94444;
  color:#fff;
  font-size:11px;
  text-align:center;
}

.main{
  width:100%;
  margin-left:245px;
  min-height:100vh;
  padding:30px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.page-title{
  font-size:27px;
  font-weight:800;
}

.user-mini{
  color:#aaa;
  font-size:14px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  backdrop-filter:blur(18px);
  box-shadow:0 15px 50px rgba(0,0,0,.2);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}

.btn{
  border:1px solid var(--border);
  background:#17191d;
  color:#fff;
  padding:11px 15px;
  border-radius:10px;
  cursor:pointer;
  transition:.18s;
}

.btn:hover{background:#202329}
.btn.primary{background:#586373}
.btn.green{background:#28633f}
.btn.red{background:#743535}
.btn.gold{background:#735c25}

input,textarea,select{
  width:100%;
  background:#0f1114;
  border:1px solid var(--border);
  color:#fff;
  outline:none;
  border-radius:10px;
  padding:12px;
}

textarea{
  min-height:130px;
  resize:vertical;
}

label{
  display:block;
  margin-bottom:7px;
  color:#aeb2b9;
  font-size:13px;
}

.form-row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:12px;
}

.auth-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth{
  width:min(430px,100%);
}

.auth h1{
  margin-top:0;
}

.auth-tabs{
  display:flex;
  gap:6px;
  margin-bottom:15px;
}

.auth-tabs button{flex:1}

.plate-wrap{
  display:flex;
  align-items:stretch;
  justify-content:center;
  margin:30px 0;
}

.plate{
  min-width:330px;
  height:105px;
  background:#eee;
  color:#111;
  border-radius:8px 0 0 8px;
  border:4px solid #c9c9c9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  font-weight:900;
  letter-spacing:5px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.region-box{
  width:92px;
  height:105px;
  background:#eee;
  color:#111;
  border:4px solid #c9c9c9;
  border-left:0;
  border-radius:0 8px 8px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.region{
  font-size:32px;
  font-weight:900;
}

.rus{
  font-size:11px;
  margin-top:1px;
}

.flag{
  font-size:18px;
  line-height:18px;
}

.plate.gold{
  border-color:#d7b044;
  box-shadow:0 0 35px rgba(216,173,70,.25);
}

.plate.rare{
  border-color:#aaa;
}

.spinner-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.spinner-buttons button{
  padding:16px 8px;
  font-weight:800;
}

.placeholder{
  opacity:.68;
}

.status{
  text-align:center;
  color:var(--muted);
  margin:12px 0;
}

.item{
  border:1px solid var(--border);
  background:rgba(255,255,255,.025);
  border-radius:13px;
  padding:15px;
  margin-bottom:10px;
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.money{
  font-weight:800;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,.table td{
  padding:11px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:7px;
  font-size:11px;
  background:#24272c;
  color:#ccc;
}

.badge.red{background:#642e2e}
.badge.green{background:#24563a}
.badge.gold{background:#624f21}

.hidden{display:none!important}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#181a1e;
  border:1px solid var(--border);
  padding:13px 17px;
  border-radius:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
  z-index:100;
}

@media(max-width:800px){
  .sidebar{
    width:100%;
    height:auto;
    min-height:0;
    position:relative;
    border-right:0;
    border-bottom:1px solid var(--border);
  }

  .app{display:block}

  .main{
    margin-left:0;
    padding:18px;
  }

  .nav{
    display:grid;
    grid-template-columns:repeat(2,1fr);
  }

  .form-row{
    grid-template-columns:1fr;
  }

  .plate{
    min-width:0;
    width:calc(100% - 80px);
    font-size:35px;
    height:80px;
  }

  .region-box{
    width:80px;
    height:80px;
  }
}
</style>
</head>

<body>

<div id="authScreen" class="auth-wrap">
  <div class="auth card">
    <h1>D0NTYYY</h1>
    <p class="small">License Plates</p>

    <div class="auth-tabs">
      <button class="btn primary" id="loginTab" onclick="setAuthMode('login')">Войти</button>
      <button class="btn" id="registerTab" onclick="setAuthMode('register')">Регистрация</button>
    </div>

    <div id="authForm"></div>
  </div>
</div>

<div id="app" class="app hidden">

  <aside class="sidebar">
    <div class="logo">D0NTYYY</div>

    <div class="nav" id="nav"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div id="pageTitle" class="page-title">Главная</div>
      <div id="userMini" class="user-mini"></div>
    </div>

    <div id="content"></div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL = 'https://wehiexatkhqbfcelvjnr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JR5bFKt15zPnzAzeripx8w___vtFpW1';

let state = {
  users:[],
  plates:[],
  market:[],
  tags:[],
  reports:[],
  messages:[],
  promocodes:[],
  punishments:[]
};

let currentUser = null;
let currentPage = 'home';
let authMode = 'login';

const roles = {
  helper:'Хелпер',
  moderator:'Модератор',
  senior_moderator:'Старший модератор',
  administrator:'Администратор',
  chief_administrator:'Главный администратор',
  deputy_founder:'Заместитель основателя',
  owner:'Владелец'
};

const spinState = {
  first:'О',
  numbers:'000',
  last:'ОО',
  region:'000',
  placeholder:true,
  created:false,
  rarity:'common'
};

function uid(){
  return Math.random().toString(36).slice(2)+Date.now().toString(36);
}

function esc(v){
  return String(v ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function toast(text){
  const el=document.getElementById('toast');
  el.textContent=text;
  el.classList.remove('hidden');
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2800);
}

function normalize(){
  if(!Array.isArray(state.users)) state.users=[];
  if(!Array.isArray(state.plates)) state.plates=[];
  if(!Array.isArray(state.market)) state.market=[];
  if(!Array.isArray(state.tags)) state.tags=[];
  if(!Array.isArray(state.reports)) state.reports=[];
  if(!Array.isArray(state.messages)) state.messages=[];
  if(!Array.isArray(state.promocodes)) state.promocodes=[];
  if(!Array.isArray(state.punishments)) state.punishments=[];

  state.users.forEach(u=>{
    if(!Array.isArray(u.inventory)) u.inventory=[];
    if(!Array.isArray(u.usedPromocodes)) u.usedPromocodes=[];
    if(!u.role) u.role=null;
    if(!('banned' in u)) u.banned=false;
    if(typeof u.balance!=='number') u.balance=100000;
  });
}

async function cloudLoad(){
  const r=await fetch(
    SUPABASE_URL+'/rest/v1/license_state?id=eq.1&select=id,state,updated_at',
    {
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:'Bearer '+SUPABASE_KEY
      }
    }
  );

  if(!r.ok) throw new Error(await r.text());

  const rows=await r.json();

  if(rows.length && rows[0].state){
    state=typeof rows[0].state==='string'
      ? JSON.parse(rows[0].state)
      : rows[0].state;
  }

  normalize();
}

async function cloudSave(){
  normalize();

  const r=await fetch(
    SUPABASE_URL+'/rest/v1/license_state?id=eq.1',
    {
      method:'PATCH',
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        Prefer:'return=minimal'
      },
      body:JSON.stringify({
        state,
        updated_at:new Date().toISOString()
      })
    }
  );

  if(!r.ok) throw new Error(await r.text());
}

function findUserByNick(nick){
  return state.users.find(
    u=>u.nickname.toLowerCase()===nick.toLowerCase()
  );
}

function findUser(id){
  return state.users.find(u=>u.id===id);
}

function addMessage(userId,title,text,type='system'){
  state.messages.push({
    id:uid(),
    userId,
    title,
    text,
    type,
    read:false,
    createdAt:new Date().toISOString()
  });
}

function unreadCount(){
  if(!currentUser) return 0;
  return state.messages.filter(
    m=>m.userId===currentUser.id && !m.read
  ).length;
}

function resetSpin(){
  spinState.first='О';
  spinState.numbers='000';
  spinState.last='ОО';
  spinState.region='000';
  spinState.placeholder=true;
  spinState.created=false;
  spinState.rarity='common';
}

function randomRegion(){
  const regions=[
    '77','97','99','177','197','199','777','799','50','90','150',
    '190','750','790','116','716','23','93','123','193','196'
  ];

  return regions[Math.floor(Math.random()*regions.length)];
}

const letters=['А','В','Е','К','М','Н','О','Р','С','Т','У','Х'];

function randomLetters(){
  const rareRoll=Math.random();

  if(rareRoll<0.003){
    const l=letters[Math.floor(Math.random()*letters.length)];
    return {first:l,last:l+l,rarity:'gold'};
  }

  if(rareRoll<0.03){
    const a=letters[Math.floor(Math.random()*letters.length)];
    let b=letters[Math.floor(Math.random()*letters.length)];
    if(b===a) b=letters[(letters.indexOf(a)+1)%letters.length];

    return {
      first:a,
      last:b+a,
      rarity:'rare'
    };
  }

  let a=letters[Math.floor(Math.random()*letters.length)];
  let b=letters[Math.floor(Math.random()*letters.length)];
  let c=letters[Math.floor(Math.random()*letters.length)];

  while(b===a) b=letters[Math.floor(Math.random()*letters.length)];
  while(c===a || c===b) c=letters[Math.floor(Math.random()*letters.length)];

  return {
    first:a,
    last:b+c,
    rarity:'common'
  };
}

function randomNumbers(){
  const roll=Math.random();

  if(roll<0.003){
    const n=Math.floor(Math.random()*10);
    return {
      value:String(n).repeat(3),
      rarity:'gold'
    };
  }

  if(roll<0.03){
    const a=Math.floor(Math.random()*10);
    let b=Math.floor(Math.random()*10);

    while(b===a) b=Math.floor(Math.random()*10);

    return {
      value:`${a}${a}${b}`,
      rarity:'rare'
    };
  }

  let a=Math.floor(Math.random()*10);
  let b=Math.floor(Math.random()*10);
  let c=Math.floor(Math.random()*10);

  while(b===a) b=Math.floor(Math.random()*10);
  while(c===a || c===b) c=Math.floor(Math.random()*10);

  return {
    value:`${a}${b}${c}`,
    rarity:'common'
  };
}

function spinLetters(){
  const x=randomLetters();

  spinState.first=x.first;
  spinState.last=x.last;
  spinState.placeholder=false;
  spinState.created=true;

  if(x.rarity==='gold' || spinState.rarity==='gold')
    spinState.rarity='gold';
  else if(x.rarity==='rare' || spinState.rarity==='rare')
    spinState.rarity='rare';
  else
    spinState.rarity='common';

  renderCurrentPage();
}

function spinNumbers(){
  const x=randomNumbers();

  spinState.numbers=x.value;
  spinState.placeholder=false;
  spinState.created=true;

  if(x.rarity==='gold' || spinState.rarity==='gold')
    spinState.rarity='gold';
  else if(x.rarity==='rare' || spinState.rarity==='rare')
    spinState.rarity='rare';
  else
    spinState.rarity='common';

  renderCurrentPage();
}

function spinRegion(){
  spinState.region=randomRegion();
  spinState.placeholder=false;
  spinState.created=true;
  renderCurrentPage();
}

function currentPlate(){
  return `${spinState.first}${spinState.numbers}${spinState.last}`;
}

function isPlaceholder(){
  return spinState.placeholder ||
    (
      spinState.first==='О' &&
      spinState.numbers==='000' &&
      spinState.last==='ОО' &&
      spinState.region==='000'
    );
}

function rarityLabel(r){
  if(r==='gold') return 'Золотой';
  if(r==='rare') return 'Редкий';
  return 'Обычный';
}

function homePage(){
  const plate=currentPlate();

  return `
    <div class="grid">

      <div class="card">
        <div class="small">Ваш баланс</div>
        <div style="font-size:30px;font-weight:900;margin-top:7px">
          ${currentUser.balance.toLocaleString('ru-RU')} ₽
        </div>
      </div>

      <div class="card">
        <div class="small">Ваш номер</div>
        <div style="font-size:22px;font-weight:800;margin-top:7px">
          ${currentUser.inventory.length}
        </div>
      </div>

    </div>

    <div class="card" style="margin-top:16px">
      <h2>Крутилка номерных знаков</h2>

      <div class="plate-wrap">
        <div class="plate ${spinState.rarity} ${isPlaceholder()?'placeholder':''}">
          ${esc(plate)}
        </div>

        <div class="region-box">
          <div class="region">${esc(spinState.region)}</div>
          <div class="rus">RUS</div>
          <div class="flag">🇷🇺</div>
        </div>
      </div>

      <div class="status">
        ${isPlaceholder()
          ? 'О00ОО / 000 — заглушка. Купить её нельзя.'
          : rarityLabel(spinState.rarity)}
      </div>

      <div class="spinner-buttons">
        <button class="btn" onclick="spinLetters()">БУКВЫ</button>
        <button class="btn" onclick="spinNumbers()">ЦИФРЫ</button>
        <button class="btn" onclick="spinRegion()">РЕГИОН</button>
      </div>

      <div style="display:flex;gap:10px;margin-top:12px">
        <button
          class="btn primary"
          style="flex:1"
          onclick="buyCurrent()"
          ${isPlaceholder()?'disabled':''}
        >
          КУПИТЬ
        </button>

        <button
          class="btn"
          onclick="resetSpin()"
        >
          СБРОСИТЬ
        </button>
      </div>
    </div>
  `;
}

function inventoryPage(){
  const items=currentUser.inventory || [];

  return `
    <div class="card">
      <h2>Инвентарь</h2>

      ${
        !items.length
        ? `<div class="small">У вас пока нет номерных знаков.</div>`
        : items.map(p=>`
          <div class="item">
            <div class="item-head">
              <div>
                <b>${esc(p.plate)}</b>
                <span class="badge">${esc(p.region)}</span>
              </div>
              <span class="badge ${p.rarity==='gold'?'gold':''}">
                ${rarityLabel(p.rarity)}
              </span>
            </div>

            <div class="small" style="margin-top:8px">
              Куплен за ${Number(p.price||0).toLocaleString('ru-RU')} ₽
            </div>

            <div style="display:flex;gap:8px;margin-top:10px">
              <button class="btn" onclick="sellToMarket('${p.id}')">
                Выставить на рынок
              </button>
            </div>
          </div>
        `).join('')
      }
    </div>
  `;
}

function marketPage(){
  return `
    <div class="card">
      <h2>Магазин</h2>

      ${
        !state.market.length
        ? `<div class="small">На рынке пока ничего нет.</div>`
        : state.market.map(p=>`
          <div class="item">
            <div class="item-head">
              <div>
                <b>${esc(p.plate)}</b>
                <span class="badge">${esc(p.region)}</span>
              </div>

              <b>${Number(p.price).toLocaleString('ru-RU')} ₽</b>
            </div>

            <div class="small" style="margin-top:6px">
              ${rarityLabel(p.rarity)} · продавец ${esc(p.sellerNickname)}
            </div>

            <button
              class="btn primary"
              style="margin-top:10px"
              onclick="buyMarket('${p.id}')"
            >
              КУПИТЬ
            </button>
          </div>
        `).join('')
      }
    </div>
  `;
}

function topPage(){
  const users=[...state.users]
    .sort((a,b)=>Number(b.balance||0)-Number(a.balance||0))
    .slice(0,15);

  return `
    <div class="card">
      <h2>ТОП 15</h2>

      ${users.map((u,i)=>`
        <div
          class="item"
          style="${
            i===0?'border-color:#d8ad46':
            i===1?'border-color:#aaa':
            i===2?'border-color:#9b673e':''
          }"
        >
          <div class="item-head">
            <b>#${i+1} ${esc(u.nickname)}</b>
            <span>${Number(u.balance||0).toLocaleString('ru-RU')} ₽</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function messagesPage(){
  const messages=state.messages
    .filter(m=>m.userId===currentUser.id)
    .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  return `
    <div class="card">
      <h2>Сообщения</h2>

      ${
        !messages.length
        ? `<div class="small">Сообщений пока нет.</div>`
        : messages.map(m=>`
          <div
            class="item"
            style="${!m.read?'border-color:#667180':''}"
          >
            <div class="item-head">
              <b>${esc(m.title)}</b>
              ${
                !m.read
                ? `<span class="badge">Новое</span>`
                : ''
              }
            </div>

            <div style="margin-top:8px">
              ${esc(m.text)}
            </div>

            <div class="small" style="margin-top:8px">
              ${new Date(m.createdAt).toLocaleString('ru-RU')}
            </div>

            ${
              !m.read
              ? `<button
                  class="btn"
                  style="margin-top:10px"
                  onclick="readMessage('${m.id}')"
                >
                  Прочитано
                </button>`
              : ''
            }
          </div>
        `).join('')
      }
    </div>
  `;
}

function accountPage(){
  return `
    <div class="grid">

      <div class="card">
        <h2>Аккаунт</h2>

        <div class="item">
          <div class="small">Никнейм</div>
          <b>${esc(currentUser.nickname)}</b>
        </div>

        <div class="item">
          <div class="small">Баланс</div>
          <b>${Number(currentUser.balance).toLocaleString('ru-RU')} ₽</b>
        </div>

        <div class="item">
          <div class="small">Должность</div>
          <b>${currentUser.role ? roles[currentUser.role] : 'Игрок'}</b>

async function applyPunishment(){
  const user=findUser(document.getElementById('punishUser').value);
  const type=document.getElementById('punishType').value;
  const duration=document.getElementById('punishDuration').value.trim();
  const reason=document.getElementById('punishReason').value.trim();

  if(!user) return;

  if(type==='unban'){
    user.banned=false;

    state.punishments
      .filter(p=>p.userId===user.id && p.type==='ban' && p.status==='active')
      .forEach(p=>{
        p.status='removed';
        p.removedAt=new Date().toISOString();
      });

    addMessage(
      user.id,
      'Вас разбанили',
      'С вас снято блокирование аккаунта.',
      'unban'
    );
  }

  if(type==='ban'){
    user.banned=true;

    state.punishments.push({
      id:uid(),
      userId:user.id,
      nickname:user.nickname,
      type:'ban',
      title:'Бан',
      reason,
      duration,
      status:'active',
      issuedBy:currentUser.nickname,
      createdAt:new Date().toISOString()
    });

    addMessage(
      user.id,
      'Вам выдан бан',
      `Вам выдан бан.${duration?' Срок: '+duration+'.':''}${reason?' Причина: '+reason+'.':''}`,
      'ban'
    );
  }

  if(type==='mute'){
    state.punishments.push({
      id:uid(),
      userId:user.id,
      nickname:user.nickname,
      type:'mute',
      title:'Мут',
      reason,
      duration,
      status:'active',
      issuedBy:currentUser.nickname,
      createdAt:new Date().toISOString()
    });

    addMessage(
      user.id,
      'Вам выдан мут',
      `Вам выдан мут.${duration?' Срок: '+duration+'.':''}${reason?' Причина: '+reason+'.':''}`,
      'mute'
    );
  }

  if(type==='warn'){
    state.punishments.push({
      id:uid(),
      userId:user.id,
      nickname:user.nickname,
      type:'warn',
      title:'Предупреждение',
      reason,
      duration:'',
      status:'active',
      issuedBy:currentUser.nickname,
      createdAt:new Date().toISOString()
    });

    addMessage(
      user.id,
      'Вам выдано предупреждение',
      `Вам выдано предупреждение.${reason?' Причина: '+reason+'.':''}`,
      'warn'
    );
  }

  await cloudSave();
  adminPunishments();
  toast('Наказание применено');
}

async function buyCurrent(){
  if(isPlaceholder())
    return toast('Заглушку О00ОО / 000 нельзя купить');

  const plate=currentPlate();
  const region=spinState.region;

  const duplicate =
    state.plates.some(p=>p.plate===plate && p.region===region) ||
    state.market.some(p=>p.plate===plate && p.region===region) ||
    state.users.some(u=>
      u.inventory?.some(p=>p.plate===plate && p.region===region)
    );

  if(duplicate)
    return toast('Такой номер уже существует');

  const price =
    spinState.rarity==='gold'
      ? Math.max(100000,Math.floor(Math.random()*1000000000))
      : spinState.rarity==='rare'
        ? Math.max(10000,Math.floor(Math.random()*50000000))
        : Math.max(1000,Math.floor(Math.random()*1000000));

  if(currentUser.balance<price)
    return toast('Недостаточно денег');

  currentUser.balance-=price;

  const item={
    id:uid(),
    plate,
    region,
    rarity:spinState.rarity,
    price,
    ownerId:currentUser.id,
    createdAt:new Date().toISOString()
  };

  currentUser.inventory.push(item);
  state.plates.push(item);

  await cloudSave();

  resetSpin();
  currentPage='inventory';
  renderCurrentPage();

  toast('Номер куплен');
}

async function sellToMarket(id){
  const item=currentUser.inventory.find(p=>p.id===id);
  if(!item) return;

  const price=prompt('Цена продажи');

  if(price===null) return;

  const num=Number(price);

  if(!Number.isFinite(num) || num<0)
    return toast('Некорректная цена');

  currentUser.inventory=
    currentUser.inventory.filter(p=>p.id!==id);

  state.market.push({
    ...item,
    sellerId:currentUser.id,
    sellerNickname:currentUser.nickname,
    price:num,
    listedAt:new Date().toISOString()
  });

  await cloudSave();
  renderCurrentPage();
}

async function buyMarket(id){
  const item=state.market.find(p=>p.id===id);
  if(!item) return;

  const price=Number(item.price)||0;

  if(currentUser.balance<price)
    return toast('Недостаточно денег');

  if(item.sellerId===currentUser.id)
    return toast('Нельзя купить свой номер');

  const seller=findUser(item.sellerId);

  currentUser.balance-=price;

  if(seller)
    seller.balance+=price;

  currentUser.inventory.push({
    ...item,
    id:uid(),
    ownerId:currentUser.id
  });

  state.market=state.market.filter(p=>p.id!==id);

  await cloudSave();
  syncCurrentUser();
  renderCurrentPage();

  toast('Номер куплен');
}

}

function navHtml(){
  const unread=unreadCount();

  let html=`
    <button data-page="home" onclick="showPage('home')">Главная</button>
    <button data-page="inventory" onclick="showPage('inventory')">Инвентарь</button>
    <button data-page="market" onclick="showPage('market')">Магазин</button>
    <button data-page="top" onclick="showPage('top')">ТОП</button>
    <button data-page="messages" onclick="showPage('messages')">
      Сообщения
      ${unread?`<span class="nav-count">${unread}</span>`:''}
    </button>
    <button data-page="report" onclick="showPage('report')">Репорт</button>
    <button data-page="account" onclick="showPage('account')">Аккаунт</button>
  `;

  if(currentUser?.nickname?.toLowerCase()==='d0ntyyy'){
    html+=`
      <button data-page="admin" onclick="showPage('admin')">
        Админка
      </button>
    `;
  }

  html+=`
    <button onclick="logout()">Выйти</button>
  `;

  return html;
}

function showPage(page){
  currentPage=page;

  const titles={
    home:'Главная',
    inventory:'Инвентарь',
    market:'Магазин',
    top:'ТОП',
    messages:'Сообщения',
    report:'Репорт',
    account:'Аккаунт',
    admin:'Админка'
  };

  document.getElementById('pageTitle').textContent=titles[page] || 'Админка';

  renderCurrentPage();
}

function renderCurrentPage(){
  if(!currentUser) return;

  document.getElementById('nav').innerHTML=navHtml();

  document.querySelectorAll('.nav button[data-page]')
    .forEach(btn=>{
      if(btn.dataset.page===currentPage)
        btn.classList.add('active');
    });

  document.getElementById('userMini').textContent=
    `${currentUser.nickname} · ${Number(currentUser.balance).toLocaleString('ru-RU')} ₽`;

  let html='';

  switch(currentPage){
    case 'home': html=homePage(); break;
    case 'inventory': html=inventoryPage(); break;
    case 'market': html=marketPage(); break;
    case 'top': html=topPage(); break;
    case 'messages': html=messagesPage(); break;
    case 'report': html=reportPage(); break;
    case 'account': html=accountPage(); break;
    case 'admin': html=adminPage(); break;
    case 'admin-users': adminUsers(); return;
    case 'admin-roles': adminRoles(); return;
    case 'admin-tags': adminTags(); return;
    case 'admin-numbers': adminNumbers(); return;
    case 'admin-promocodes': adminPromocodes(); return;
    case 'admin-punishments': adminPunishments(); return;
    case 'admin-reports': adminReports(); return;
    case 'admin-stats': adminStats(); return;
    default: html=homePage();
  }

  document.getElementById('content').innerHTML=html;
}

function setAuthMode(mode){
  authMode=mode;

  document.getElementById('loginTab')
    .classList.toggle('primary',mode==='login');

  document.getElementById('registerTab')
    .classList.toggle('primary',mode==='register');

  renderAuth();
}

function renderAuth(){
  document.getElementById('authForm').innerHTML=`
    <input
      id="authNick"
      placeholder="Никнейм"
      autocomplete="off"
    >

    <input
      id="authPassword"
      type="password"
      placeholder="Пароль"
      style="margin-top:10px"
    >

    <button
      class="btn primary"
      style="width:100%;margin-top:12px"
      onclick="authSubmit()"
    >
      ${authMode==='login'?'ВОЙТИ':'ЗАРЕГИСТРИРОВАТЬСЯ'}
    </button>
  `;
}

async function authSubmit(){
  const nickname=document.getElementById('authNick').value.trim();
  const password=document.getElementById('authPassword').value;

  if(!nickname || !password)
    return toast('Заполните все поля');

  if(authMode==='register'){
    if(findUserByNick(nickname))
      return toast('Такой никнейм уже существует');

    const user={
      id:uid(),
      nickname,
      password,
      balance:100000,
      inventory:[],
      usedPromocodes:[],
      role:null,
      banned:false,
      createdAt:new Date().toISOString()
    };

    state.users.push(user);

    await cloudSave();

    currentUser=user;

    resetSpin();

    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    currentPage='home';
    renderCurrentPage();

    return;
  }

  const user=findUserByNick(nickname);

  if(!user || user.password!==password)
    return toast('Неверный никнейм или пароль');

  if(user.banned)
    return toast('Ваш аккаунт заблокирован');

  currentUser=user;

  if(currentUser.nickname.toLowerCase()==='d0ntyyy'){
    currentUser.role='owner';
    currentUser.balance=Math.max(
      Number(currentUser.balance)||0,
      10000000
    );
    await cloudSave();
  }

  resetSpin();

  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  currentPage='home';
  renderCurrentPage();
}

function logout(){
  currentUser=null;
  resetSpin();

  document.getElementById('app').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');

  currentPage='home';
  renderAuth();
}

async function syncCloud(){
  try{
    await cloudLoad();

    if(currentUser){
      syncCurrentUser();

      if(currentUser.banned){
        logout();
        toast('Ваш аккаунт заблокирован');
        return;
      }

      renderCurrentPage();
    }
  }catch(e){
    console.error(e);
  }
}

async function boot(){
  renderAuth();

  try{
    await cloudLoad();

    const owner=state.users.find(
      u=>u.nickname.toLowerCase()==='d0ntyyy'
    );

    if(owner){
      owner.role='owner';
    }
  }catch(e){
    console.error(e);
    toast('Ошибка подключения к базе данных');
  }
}

setInterval(syncCloud,5000);

boot();
</script>

</body>
</html>
