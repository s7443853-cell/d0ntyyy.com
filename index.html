<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D0NTYYY — License Plates</title>

<style>
:root{
 --bg:#0d0e10;--panel:#131519;--panel2:#181a1f;--line:#292d34;
 --text:#f2f3f5;--muted:#8d939c;--green:#43d17b;--red:#ff4d5a;
 --blue:#6ea8ff;--gold:#ffd65b
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:linear-gradient(180deg,#090a0c,#111318);
 color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.topbar{
 position:sticky;top:0;z-index:20;display:flex;align-items:center;
 gap:8px;padding:12px 18px;background:rgba(10,11,13,.88);
 backdrop-filter:blur(15px);border-bottom:1px solid var(--line)
}
.brand{font-weight:900;letter-spacing:1px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:15px}
.nav button,.ghost,.btn{
 border:1px solid var(--line);background:#15181d;color:#fff;
 padding:10px 13px;border-radius:9px
}
.nav button:hover,.nav button.active,.btn:hover,.ghost:hover{
 background:#22262d
}
.spacer{flex:1}

.page{max-width:1120px;margin:auto;padding:25px 18px 60px}
.card{
 background:rgba(19,21,25,.9);border:1px solid var(--line);
 border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.4)
}
.auth{max-width:430px;margin:10vh auto;padding:25px}
.tabs{display:flex;gap:7px;margin:18px 0}
.tabs button{flex:1}
.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}
.field label{font-size:11px;color:var(--muted);font-weight:900}
input,select{
 width:100%;background:#0e1014;color:#fff;border:1px solid var(--line);
 border-radius:9px;padding:11px;outline:0
}
input:focus,select:focus{border-color:#58606c}

.hero{text-align:center;padding:30px}
.hero h1{margin:0 0 8px}
.muted{color:var(--muted)}
.error{color:#ff737c;margin-top:10px;font-size:13px}
.success{color:#6fe09b;margin-top:10px;font-size:13px}

.plate-wrap{display:flex;justify-content:center;margin:25px 0}
.plate{
 width:min(620px,94vw);min-height:125px;padding:18px 25px;
 display:flex;align-items:center;justify-content:center;gap:15px;
 border-radius:18px;background:linear-gradient(#fafafa,#cfd2d5);
 color:#111;border:4px solid #292b2e;
 box-shadow:0 8px 35px rgba(255,255,255,.07)
}
.plate.gold{
 box-shadow:0 0 40px rgba(255,210,70,.4)
}
.plate.rare{
 box-shadow:0 0 35px rgba(90,145,255,.3)
}
.main-code{
 font-size:clamp(38px,7vw,70px);font-weight:1000;letter-spacing:4px
}
.region{
 font-weight:900;font-size:25px;border-left:2px solid #999;
 padding-left:13px
}
.rarity{font-weight:900}
.gold-text{color:var(--gold)}
.rare-text{color:var(--blue)}

.spin-grid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px
}
.spin-grid button{
 min-height:60px;border:1px solid var(--line);border-radius:11px;
 background:#15181d;color:#fff;font-weight:900
}
.spin-grid button:hover{background:#22262c}

.balance{text-align:center;margin:15px;font-size:16px}
.center{text-align:center}
.stack{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:9px}
.row{
 padding:15px;border:1px solid var(--line);border-radius:12px;
 background:#111318
}
.row-main{
 display:flex;justify-content:space-between;align-items:center;gap:10px
}
.grid{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:12px
}
.badge{
 display:inline-flex;padding:5px 9px;border-radius:99px;
 border:1px solid var(--line);font-size:11px;font-weight:900
}
.badge.gold{color:#ffe17c;background:#332b12}
.badge.blue{color:#a5c6ff;background:#10223b}
.badge.green{color:#74e4a2;background:#10291b}
.badge.red{color:#ff858c;background:#35151a}

.admin-overlay{
 position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);
 backdrop-filter:blur(10px);display:flex;align-items:center;
 justify-content:center;padding:18px
}
.admin-window{
 width:min(1350px,98vw);height:min(900px,95vh);
 display:grid;grid-template-columns:250px 1fr;
 background:#0e1014;border:1px solid #333842;border-radius:20px;
 overflow:hidden
}
.admin-side{
 padding:15px;border-right:1px solid var(--line);
 overflow:auto
}
.admin-side button{
 width:100%;text-align:left;margin-bottom:7px;
 border:1px solid var(--line);background:#12151a;color:#fff;
 padding:12px;border-radius:9px;font-weight:800
}
.admin-side button.active{background:#242932}
.admin-content{padding:25px;overflow:auto}
.admin-head{
 display:flex;justify-content:space-between;align-items:center;
 margin-bottom:20px
}

.modal{
 position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.75);
 display:flex;align-items:center;justify-content:center;padding:18px
}
.modal-box{
 width:min(450px,95vw);padding:22px;background:#14171c;
 border:1px solid var(--line);border-radius:16px
}

.toast{
 position:fixed;right:18px;bottom:18px;z-index:300;
 background:#171a1f;border:1px solid var(--line);
 border-radius:11px;padding:14px;max-width:390px
}

table{width:100%;border-collapse:collapse}
th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left}
.rank1{background:linear-gradient(90deg,rgba(255,214,91,.2),transparent)}
.rank2{background:linear-gradient(90deg,rgba(210,215,224,.18),transparent)}
.rank3{background:linear-gradient(90deg,rgba(194,131,80,.18),transparent)}

@media(max-width:760px){
 .admin-window{grid-template-columns:1fr;height:95vh}
 .admin-side{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow:auto}
 .admin-side button{min-width:150px}
 .spin-grid{grid-template-columns:1fr}
 .nav{margin-left:0}
}
</style>
</head>

<body>

<div id="authView">
 <div class="card auth">
  <div class="brand" style="font-size:22px">D0NTYYY — LICENSE PLATES</div>

  <div class="tabs">
   <button id="loginTab" class="btn">Войти</button>
   <button id="registerTab" class="btn">Регистрация</button>
  </div>

  <div id="authForm"></div>
 </div>
</div>

<div id="appView" class="hidden">

 <header class="topbar">
  <div class="brand">D0NTYYY</div>
  <nav class="nav" id="nav"></nav>
  <div class="spacer"></div>
  <button class="ghost" id="logoutBtn">Выйти</button>
 </header>

 <main id="pages"></main>
</div>

<div id="adminOverlay" class="admin-overlay hidden">
 <div class="admin-window">

  <aside class="admin-side" id="adminSide"></aside>

  <section class="admin-content">
   <div class="admin-head">
    <div>
     <div style="font-size:20px;font-weight:900">АДМИН-ПАНЕЛЬ</div>
     <div class="muted">D0NTYYY — управление проектом</div>
    </div>
    <button class="ghost" id="closeAdmin">Закрыть</button>
   </div>

   <div id="adminContent"></div>
  </section>

 </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
'use strict';

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
 'https://wehiexatkhqbfcelvjnr.supabase.co';

const SUPABASE_KEY =
 'sb_publishable_JR5bFKt15zPnzAzeripx8w___vtFpW1';

const OWNER = 'd0ntyyy';
const OWNER_PASSWORD = 'Semen20151';

const STATE_ID = 1;

const EMPTY_STATE = {
 users:[],
 market:[],
 messages:[],
 punishments:[],
 tags:[],
 plates:[],
 reports:[],
 promocodes:[]
};

let state = structuredClone(EMPTY_STATE);
let currentUser = null;
let authMode = 'login';
let adminSection = 'users';
let saveTimer = null;
let saving = false;
let dirty = false;

/* =========================================================
   SUPABASE REST
========================================================= */

function headers(extra={}){
 return {
  'apikey':SUPABASE_KEY,
  'Authorization':'Bearer '+SUPABASE_KEY,
  'Content-Type':'application/json',
  'Accept':'application/json',
  ...extra
 };
}

async function dbGet(){
 const r = await fetch(
  SUPABASE_URL+
  '/rest/v1/license_state?id=eq.1&select=id,state,updated_at',
  {
   method:'GET',
   headers:headers({'Cache-Control':'no-cache'})
  }
 );

 const text = await r.text();

 if(!r.ok){
  throw new Error(text || ('HTTP '+r.status));
 }

 let rows;

 try{
  rows = JSON.parse(text);
 }catch{
  throw new Error('Supabase вернул неправильный JSON.');
 }

 if(!rows.length){
  throw new Error('В license_state нет записи id=1.');
 }

 return rows[0];
}

async function dbSave(){
 if(saving || !dirty) return;

 saving = true;

 const snapshot = structuredClone(state);

 try{

  const r = await fetch(
   SUPABASE_URL+'/rest/v1/license_state?id=eq.1',
   {
    method:'PATCH',
    headers:headers({
     'Prefer':'return=minimal'
    }),
    body:JSON.stringify({
     state:snapshot,
     updated_at:new Date().toISOString()
    })
   }
  );

  const text = await r.text();

  if(!r.ok){
   throw new Error(text || ('HTTP '+r.status));
  }

  dirty = false;

 }catch(e){

  console.error(e);
  toast('Ошибка сохранения: '+e.message);

 }finally{

  saving = false;
 }
}

function saveState(){
 dirty = true;

 clearTimeout(saveTimer);

 saveTimer = setTimeout(()=>{
  dbSave();
 },300);
}

function replaceState(newState){
 state = {
  ...structuredClone(EMPTY_STATE),
  ...(newState || {})
 };

 normalizeState();
}

/* =========================================================
   DATA
========================================================= */

function normalizeState(){

 if(!Array.isArray(state.users))state.users=[];
 if(!Array.isArray(state.market))state.market=[];
 if(!Array.isArray(state.messages))state.messages=[];
 if(!Array.isArray(state.punishments))state.punishments=[];
 if(!Array.isArray(state.tags))state.tags=[];
 if(!Array.isArray(state.plates))state.plates=[];
 if(!Array.isArray(state.reports))state.reports=[];
 if(!Array.isArray(state.promocodes))state.promocodes=[];

 state.users.forEach(u=>{

  if(!u.id)u.id=crypto.randomUUID();

  u.nickname=String(u.nickname||'').trim();

  if(typeof u.balance!=='number')
   u.balance=100000;

  if(!Array.isArray(u.inventory))
   u.inventory=[];

  if(!Array.isArray(u.adminHistory))
   u.adminHistory=[];

  u.admin=!!u.admin;

 });

 /* ВЛАДЕЛЕЦ ВСЕГДА ВОССТАНАВЛИВАЕТСЯ */

 let owner = state.users.find(
  u=>String(u.nickname).toLowerCase()===OWNER
 );

 if(!owner){

  owner={
   id:crypto.randomUUID(),
   nickname:OWNER,
   password:OWNER_PASSWORD,
   accountId:'000001',
   balance:10000000,
   createdAt:Date.now(),
   admin:true,
   adminRole:'owner',
   inventory:[],
   adminHistory:[]
  };

  state.users.unshift(owner);

 }else{

  owner.password=OWNER_PASSWORD;
  owner.nickname=OWNER;
  owner.balance=Math.max(Number(owner.balance)||0,10000000);
  owner.admin=true;
  owner.adminRole='owner';

 }

 /* account ID */

 const ids=new Set();

 state.users.forEach(u=>{

  if(
   !/^\d{6}$/.test(String(u.accountId||'')) ||
   ids.has(String(u.accountId))
  ){

   let id;

   do{
    id=String(Math.floor(100000+Math.random()*900000));
   }while(ids.has(id));

   u.accountId=id;

  }

  ids.add(String(u.accountId));
 });

}

/* =========================================================
   HELPERS
========================================================= */

function esc(v){
 return String(v??'').replace(/[&<>"']/g,m=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#039;'
 }[m]));
}

function uid(){
 return crypto.randomUUID
  ? crypto.randomUUID()
  : String(Date.now()+Math.random());
}

function userById(id){
 return state.users.find(u=>u.id===id);
}

function userByNick(nick){
 return state.users.find(
  u=>String(u.nickname).toLowerCase()===
     String(nick).trim().toLowerCase()
 );
}

function isOwner(u=currentUser){
 return !!u &&
  String(u.nickname).toLowerCase()===OWNER;
}

function isAdmin(u=currentUser){
 return !!u && (u.admin || isOwner(u));
}

function toast(text){
 const el=document.getElementById('toast');

 el.textContent=text;
 el.classList.remove('hidden');

 clearTimeout(el._timer);

 el._timer=setTimeout(()=>{
  el.classList.add('hidden');
 },3500);
}

function money(n){
 return Number(n||0).toLocaleString('ru-RU');
}

/* =========================================================
   PLATES
========================================================= */

const LETTERS=['А','В','Е','К','М','Н','О','Р','С','Т','Х'];

function randomLetters(){
 let s='';
 for(let i=0;i<3;i++)
  s+=LETTERS[Math.floor(Math.random()*LETTERS.length)];
 return s;
}

function randomNumbers(){

 const r=Math.random();

 if(r<.02){

  const x=Math.floor(Math.random()*10);
  return ''+x+x+x;

 }

 const special=['001','007','100','500','700','900'];

 if(r<.04)
  return special[Math.floor(Math.random()*special.length)];

 return String(
  Math.floor(Math.random()*1000)
 ).padStart(3,'0');
}

function randomRegion(){
 return String(
  Math.floor(Math.random()*1000)
 ).padStart(3,'0');
}

function rarity(letters,numbers){

 const sameLetters =
  letters[0]===letters[1] &&
  letters[1]===letters[2];

 const repeatLetters =
  letters[0]===letters[1] ||
  letters[1]===letters[2] ||
  letters[0]===letters[2];

 const triple =
  numbers[0]===numbers[1] &&
  numbers[1]===numbers[2];

 const special=
  ['001','007','100','500','700','900']
  .includes(numbers);

 if(triple || special || sameLetters)
  return 'gold';

 if(repeatLetters || numbers[0]===numbers[2])
  return 'rare';

 return 'common';
}

function rarityName(r){
 if(r==='gold')return 'ЗОЛОТОЙ';
 if(r==='rare')return 'РЕДКИЙ';
 return 'ОБЫЧНЫЙ';
}

function plateCode(p){
 return `${p.letters}${p.numbers} | ${p.region}`;
}

function plateExists(code){

 const key=String(code)
  .replace(/\s/g,'')
  .toUpperCase();

 for(const u of state.users){

  for(const p of u.inventory||[]){

   if(
    String(p.code)
     .replace(/\s/g,'')
     .toUpperCase()===key
   )return true;

  }
 }

 return state.market.some(
  p=>String(p.code)
   .replace(/\s/g,'')
   .toUpperCase()===key
 );
}

/* =========================================================
   AUTH
========================================================= */

function renderAuth(){

 document.getElementById('loginTab')
  .classList.toggle('active',authMode==='login');

 document.getElementById('registerTab')
  .classList.toggle('active',authMode==='register');

 document.getElementById('authForm').innerHTML=`

 <div class="field">
  <label>НИКНЕЙМ</label>
  <input id="authNick" maxlength="24"
   placeholder="Введите никнейм"
   autocomplete="username">
 </div>

 <div class="field">
  <label>ПАРОЛЬ</label>
  <input id="authPass" type="password"
   maxlength="64"
   placeholder="Введите пароль"
   autocomplete="${authMode==='login'?'current-password':'new-password'}">
 </div>

 <button id="authSubmit"
  class="btn"
  style="width:100%">
  ${authMode==='login'
   ?'ВОЙТИ'
   :'ЗАРЕГИСТРИРОВАТЬСЯ'}
 </button>

 <div id="authError"></div>
 `;

 document.getElementById('authSubmit')
  .onclick=submitAuth;
}

function submitAuth(){

 const nick=
  document.getElementById('authNick')
   .value.trim();

 const pass=
  document.getElementById('authPass')
   .value;

 const error=
  document.getElementById('authError');

 if(!nick || pass.length<3){

  error.className='error';
  error.textContent=
   'Введите никнейм и пароль.';

  return;
 }

 if(authMode==='login'){

  const u=userByNick(nick);

  if(!u || u.password!==pass){

   /* Специально повторно проверяем владельца */

   if(
    nick.toLowerCase()===OWNER &&
    pass===OWNER_PASSWORD
   ){

    let owner=userByNick(OWNER);

    if(!owner){

     normalizeState();
     owner=userByNick(OWNER);

    }

    owner.password=OWNER_PASSWORD;
    owner.admin=true;
    owner.adminRole='owner';
    owner.balance=Math.max(
     Number(owner.balance)||0,
     10000000
    );

    currentUser=owner;

    saveState();
    openApp();

    return;
   }

   error.className='error';
   error.textContent=
    'Неверный никнейм или пароль.';

   return;
  }

  currentUser=u;
  currentUser.lastSeen=Date.now();

  sessionStorage.setItem(
   'dpy_session',
   currentUser.id
  );

  saveState();
  openApp();

 }else{

  if(userByNick(nick)){

   error.className='error';
   error.textContent=
    'Этот никнейм уже занят.';

   return;
  }

  const u={
   id:uid(),
   nickname:nick,
   password:pass,
   accountId:String(
    Math.floor(100000+Math.random()*900000)
   ),
   balance:100000,
   createdAt:Date.now(),
   admin:false,
   adminRole:null,
   inventory:[],
   adminHistory:[],
   lastSeen:Date.now()
  };

  state.users.push(u);

  currentUser=u;

  sessionStorage.setItem(
   'dpy_session',
   u.id
  );

  saveState();
  openApp();
 }
}

/* =========================================================
   NAV
========================================================= */

function buildNav(){

 const items=[
  ['home','ГЛАВНАЯ'],
  ['inventory','ИНВЕНТАРЬ'],
  ['market','МАГАЗИН'],
  ['top','ТОП'],
  ['account','АККАУНТ']
 ];

 let html=items.map(x=>
  `<button data-page="${x[0]}">${x[1]}</button>`
 ).join('');

 if(isAdmin())
  html+=`<button id="adminButton">АДМИНКА</button>`;

 document.getElementById('nav').innerHTML=html;

 document.querySelectorAll('[data-page]')
  .forEach(b=>{
   b.onclick=()=>openPage(b.dataset.page);
  });

 document.getElementById('adminButton')
  ?.addEventListener('click',openAdmin);
}

function openApp(){

 document.getElementById('authView')
  .classList.add('hidden');

 document.getElementById('appView')
  .classList.remove('hidden');

 buildNav();
 openPage('home');
}

function openPage(page){

 document.querySelectorAll('[data-page]')
  .forEach(b=>
   b.classList.toggle(
    'active',
    b.dataset.page===page
   )
  );

 if(page==='home')renderHome();
 if(page==='inventory')renderInventory();
 if(page==='market')renderMarket();
 if(page==='top')renderTop();
 if(page==='account')renderAccount();
}

/* =========================================================
   HOME
========================================================= */

function renderHome(){

 if(!currentUser)return;

 if(!currentUser.spinState){

  currentUser.spinState={
   letters:'ААА',
   numbers:'000',
   region:'000',
   created:false
  };

 }

 const s=currentUser.spinState;

 const r=s.created
  ?rarity(s.letters,s.numbers)
  :'common';

 document.getElementById('pages').innerHTML=`

 <div class="page">

  <div class="card hero">

   <h1>КРУТКА НОМЕРОВ</h1>

   <div class="muted">
    Выбирай, что прокрутить.
   </div>

   <div class="plate-wrap">

    <div id="spinPlate"
     class="plate ${r}">

     <div class="main-code">
      ${s.created
       ?esc(s.letters+s.numbers)
       :'---'}
     </div>

     <div class="region">
      RUS<br>
      ${s.created?esc(s.region):'---'}
     </div>

    </div>

   </div>

   <div id="rarityText"
    class="rarity ${r==='gold'?'gold-text':r==='rare'?'rare-text':''}">
    ${s.created?rarityName(r):'—'}
   </div>

   <div class="muted" style="margin-top:8px">
    Ваш ID: ${esc(currentUser.accountId)}
   </div>

   <div class="balance">
    Баланс:
    <b>${money(currentUser.balance)}</b>
   </div>

   <div class="spin-grid">

    <button onclick="spin('letters')">
     БУКВЫ
    </button>

    <button onclick="spin('numbers')">
     ЦИФРЫ
    </button>

    <button onclick="spin('region')">
     РЕГИОН
    </button>

   </div>

   <div style="margin-top:15px">
    <button class="btn"
     onclick="buyCurrent()">
     КУПИТЬ НОМЕР
    </button>
   </div>

  </div>

 </div>
 `;
}

function spin(type){

 if(!currentUser)return;

 if(!currentUser.spinState){

  currentUser.spinState={
   letters:randomLetters(),
   numbers:randomNumbers(),
   region:randomRegion(),
   created:true
  };

 }

 const s=currentUser.spinState;

 if(type==='letters')
  s.letters=randomLetters();

 if(type==='numbers')
  s.numbers=randomNumbers();

 if(type==='region')
  s.region=randomRegion();

 s.created=true;

 currentUser.spinState=s;

 saveState();
 renderHome();
}

function buyCurrent(){

 const s=currentUser.spinState;

 if(!s?.created){

  toast('Сначала прокрутите номер.');
  return;

 }

 const code=plateCode(s);

 if(plateExists(code)){

  toast('Этот номер уже занят.');
  return;
 }

 let price=
  Number(s.numbers)*100+
  Number(s.region);

 price=Math.max(500,price);
 price=Math.min(10000000,price);

 if(currentUser.balance<price){

  toast(
   'Недостаточно средств. Цена: '+
   money(price)
  );

  return;
 }

 const p={
  id:uid(),
  code,
  letters:s.letters,
  numbers:s.numbers,
  region:s.region,
  rarity:rarity(s.letters,s.numbers),
  active:true,
  createdAt:Date.now()
 };

 currentUser.balance-=price;
 currentUser.inventory.push(p);

 saveState();

 toast(
  `Номер ${code} куплен за ${money(price)}.`,
 );

 renderHome();
}

function sellPlate(id){

 const p=currentUser.inventory
  .find(x=>x.id===id);

 if(!p)return;

 const price=prompt(
  'Цена номера от 1 до 10 000 000:'
 );

 if(price===null)return;

 const n=Number(price);

 if(
  !Number.isInteger(n) ||
  n<1 ||
  n>10000000
 ){

  toast('Неверная цена.');
  return;
 }

 if(state.market.some(x=>x.plateId===id)){

  toast('Номер уже выставлен.');
  return;
 }

 state.market.push({
  id:uid(),
  plateId:p.id,
  code:p.code,
  sellerId:currentUser.id,
  sellerNick:currentUser.nickname,
  price:n,
  createdAt:Date.now()
 });

 saveState();

 toast('Номер выставлен на маркет.');

 renderInventory();
}

/* =========================================================
   MARKET
========================================================= */

function renderMarket(){

 document.getElementById('pages').innerHTML=`

 <div class="page">
  <div class="card" style="padding:22px">

   <h2>МАГАЗИН</h2>

   ${
    !state.market.length
    ?'<div class="muted">На маркете пока нет номеров.</div>'
    :
    `<div class="grid">
     ${state.market.map(m=>`

      <div class="row">

       <div style="font-size:24px;font-weight:1000">
        ${esc(m.code)}
       </div>

       <div class="muted">
        Продавец: ${esc(m.sellerNick)}
       </div>

       <div style="font-size:20px;font-weight:900;margin:12px 0">
        ${money(m.price)}
       </div>

       ${
        m.sellerId===currentUser.id
        ?'<span class="badge blue">ВАШ НОМЕР</span>'
        :
        `<button class="btn"
         onclick="buyMarket('${m.id}')">
         КУПИТЬ
        </button>`
       }

      </div>

     `).join('')}
    </div>`
   }

  </div>
 </div>
 `;
}

function buyMarket(id){

 const m=state.market.find(x=>x.id===id);

 if(!m)return;

 if(m.sellerId===currentUser.id){

  toast('Нельзя купить собственный номер.');
  return;
 }

 if(currentUser.balance<m.price){

  toast('Недостаточно средств.');
  return;
 }

 const seller=userById(m.sellerId);

 if(!seller){

  toast('Продавец не найден.');
  return;
 }

 const p=
  seller.inventory.find(
   x=>x.id===m.plateId
  );

 if(!p){

  toast('Номер больше недоступен.');
  state.market=
   state.market.filter(x=>x.id!==id);
  saveState();
  renderMarket();
  return;
 }

 currentUser.balance-=m.price;
 seller.balance+=m.price;

 currentUser.inventory.push(p);

 seller.inventory=
  seller.inventory.filter(
   x=>x.id!==p.id
  );

 state.market=
  state.market.filter(
   x=>x.id!==id
  );

 saveState();

 toast('Номер куплен.');

 renderMarket();
}

const ADMIN_SECTIONS=[

 ['tags','Теги'],
 ['numbers','Номера'],
 ['reports','Жалобы'],
 ['stats','Статистика']
];

function openAdmin(){

 if(!isAdmin())return;

 document.getElementById('adminOverlay')
  .classList.remove('hidden');

 renderAdmin();
}

function closeAdmin(){

 document.getElementById('adminOverlay')
  .classList.add('hidden');
}

function renderAdmin(){

 document.getElementById('adminSide').innerHTML=
 ADMIN_SECTIONS.map(([id,name])=>`
  <button
   class="${adminSection===id?'active':''}"
   onclick="adminSection='${id}';renderAdmin()">
   ${name}
  </button>
 `).join('');

 let html='';

 if(adminSection==='users')
  html=adminUsers();

 if(adminSection==='roles')
  html=adminRoles();

 if(adminSection==='tags')
  html=adminTags();

 if(adminSection==='numbers')
  html=adminNumbers();

 if(adminSection==='reports')
  html=adminReports();

 if(adminSection==='stats')
  html=adminStats();

 document.getElementById('adminContent').innerHTML=html;
}

function issueNumber(){

 const u=userById(
  document.getElementById('issueUser').value
 );

 const code=
  document.getElementById('issueCode')
   .value.trim();

 if(!u||!code){

  toast('Заполните данные.');
  return;
 }

 if(plateExists(code)){

  toast('Такой номер уже существует.');
  return;
 }

 const letters=
  code.replace(/[^А-ЯA-Z]/gi,'')
   .toUpperCase();

 const nums=
  (code.match(/\d{3}/)||['000'])[0];

 const region=
  (code.match(/\|\s*(\d{3})/)||['','000'])[1];

 u.inventory.push({
  id:uid(),
  code,
  letters:letters.slice(0,3),
  numbers:nums,
  region,
  rarity:rarity(
   letters.slice(0,3),
   nums
  ),
  active:true,
  createdAt:Date.now()
 });

 saveState();
 renderAdmin();

 toast('Номер выдан.');
}

/* =========================================================
   CROSS-DEVICE SYNC
========================================================= */

async function refreshFromCloud(){

 if(dirty || saving)return;

 try{

  const row=await dbGet();

  const oldUserId=currentUser?.id;

  replaceState(row.state);

  if(oldUserId){

   const fresh=userById(oldUserId);

   if(!fresh){

    currentUser=null;

    sessionStorage.removeItem(
     'dpy_session'
    );

    document.getElementById('appView')
     .classList.add('hidden');

    document.getElementById('authView')
     .classList.remove('hidden');

    renderAuth();

    return;
   }

   currentUser=fresh;

   buildNav();

   openPage(
    document.querySelector(
     '[data-page].active'
    )?.dataset.page || 'home'
   );
  }

 }catch(e){

  console.error('SYNC:',e);

 }
}

/* Каждые 3 секунды проверяем Supabase */

setInterval(
 refreshFromCloud,
 3000
);

/* Сохраняем при закрытии */

window.addEventListener(
 'beforeunload',
 ()=>{
  if(dirty)dbSave();
 }
);

/* =========================================================
   BOOT
========================================================= */

async function boot(){

 renderAuth();

 try{

  const row=await dbGet();

  replaceState(row.state);

  /*
   После normalizeState мог добавиться OWNER.
   Сохраняем его в облако.
  */

  saveState();

  const session=
   sessionStorage.getItem(
    'dpy_session'
   );

  if(session){

   const u=userById(session);

   if(u){

    currentUser=u;
    openApp();
    return;
   }
  }

 }catch(e){

  console.error(e);

  document.getElementById('authForm')
   .insertAdjacentHTML(
    'afterbegin',
    `<div class="error">
      Ошибка подключения к Supabase:<br>
      ${esc(e.message)}
     </div>`
   );

  return;
 }

 renderAuth();
}

boot();
