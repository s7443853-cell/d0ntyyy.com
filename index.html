<script>
'use strict';

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
'https://wehiexatkhqbfcelvjnr.supabase.co';

const SUPABASE_KEY =
'sb_publishable_JR5bFKt15zPnzAzeripx8w___vtFpW1';

const REST =
SUPABASE_URL+'/rest/v1/';

const HEADERS={
 'apikey':SUPABASE_KEY,
 'Authorization':'Bearer '+SUPABASE_KEY,
 'Content-Type':'application/json',
 'Prefer':'return=representation'
};

const OWNER='d0ntyyy';

let currentUser=null;
let authMode='login';
let currentPage='home';
let adminSection='stats';

const LETTERS=['А','В','Е','К','М','Н','О','Р','С','Т','Х'];

const ROLES=[
 'Игрок',
 'Хелпер',
 'Мл.Модератор',
 'Модератор',
 'Администратор',
 'Гл.Администратор',
 'Зам. основателя',
 'Основатель'
];

const ROLE_LEVEL={
 'Игрок':0,
 'Хелпер':1,
 'Мл.Модератор':2,
 'Модератор':3,
 'Администратор':4,
 'Гл.Администратор':5,
 'Зам. основателя':6,
 'Основатель':7
};

const punishTemplates=[
 ['Нелегальное получение номеров','Бан','7 дней'],
 ['Получение редких номеров','Бан','14 дней'],
 ['Фейк','Бан','Навсегда'],
 ['Читы','Бан','Навсегда'],
 ['Флуд в репорт','Мут репорта','14 минут'],
 ['Флуд в репорт 30+','Мут репорта','30 минут'],
 ['Снятие с поста администратора','Снятие с поста','Навсегда']
];

function esc(v){
 return String(v??'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#039;");
}

function fmt(d){
 if(!d)return '—';
 return new Date(d).toLocaleString('ru-RU');
}

async function api(table,options={}){
 let url=REST+table;

 if(options.query)url+='?'+options.query;

 const res=await fetch(url,{
  method:options.method||'GET',
  headers:{
   ...HEADERS,
   ...(options.headers||{})
  },
  body:options.body===undefined
   ?undefined
   :JSON.stringify(options.body)
 });

 const text=await res.text();

 if(!res.ok)
  throw new Error(text||('HTTP '+res.status));

 if(!text)return null;

 return JSON.parse(text);
}

async function select(table,query=''){
 return await api(table,{query});
}

async function insert(table,data){
 return await api(table,{
  method:'POST',
  body:data
 });
}

async function update(table,query,data){
 return await api(table,{
  method:'PATCH',
  query,
  body:data
 });
}

async function remove(table,query){
 return await api(table,{
  method:'DELETE',
  query
 });
}

/* =========================
   AUTH
========================= */

function renderAuth(){
 const box=document.getElementById('authForm');

 document.getElementById('loginTab')
  .classList.toggle('active',authMode==='login');

 document.getElementById('registerTab')
  .classList.toggle('active',authMode==='register');

 box.innerHTML=`
  <div class="field">
   <label>НИКНЕЙМ</label>
   <input id="authNick" autocomplete="username">
  </div>

  <div class="field">
   <label>ПАРОЛЬ</label>
   <input id="authPass" type="password" autocomplete="current-password">
  </div>

  <div id="authError"></div>

  <button class="btn btn-blue" style="width:100%" onclick="submitAuth()">
   ${authMode==='login'?'ВОЙТИ':'ЗАРЕГИСТРИРОВАТЬСЯ'}
  </button>
 `;
}

async function submitAuth(){

 const nick=document.getElementById('authNick').value.trim();
 const pass=document.getElementById('authPass').value;
 const error=document.getElementById('authError');

 error.innerHTML='';

 if(!nick||!pass){
  error.innerHTML='<div class="error">Заполни все поля.</div>';
  return;
 }

 try{

  const rows=await select(
   'users',
   'nickname=eq.'+encodeURIComponent(nick)+'&select=*'
  );

  if(authMode==='login'){

   const u=rows?.[0];

   if(!u){
    error.innerHTML='<div class="error">Пользователь не найден.</div>';
    return;
   }

   if(u.password!==pass){
    error.innerHTML='<div class="error">Неверный пароль.</div>';
    return;
   }

   if(u.banned){
    error.innerHTML='<div class="error">Аккаунт заблокирован.</div>';
    return;
   }

   currentUser=normalizeUser(u);

   if(currentUser.nickname.toLowerCase()===OWNER){
    await update(
     'users',
     'id=eq.'+currentUser.id,
     {
      is_admin:true,
      is_owner:true,
      role:'Основатель'
     }
    );

    currentUser.role='Основатель';
    currentUser.is_admin=true;
    currentUser.is_owner=true;
   }

   localStorage.setItem('dpy_session',String(currentUser.id));

   await openApp();

  }else{

   if(rows?.length){
    error.innerHTML='<div class="error">Такой ник уже зарегистрирован.</div>';
    return;
   }

   const created=await insert('users',{
    nickname:nick,
    password:pass,
    balance:100000,
    is_admin:nick.toLowerCase()===OWNER,
    is_owner:nick.toLowerCase()===OWNER,
    banned:false,
    role:nick.toLowerCase()===OWNER?'Основатель':'Игрок'
   });

   currentUser=normalizeUser(created[0]);

   localStorage.setItem('dpy_session',String(currentUser.id));

   await openApp();
  }

 }catch(e){
  console.error(e);
  error.innerHTML=
   '<div class="error">Ошибка подключения к базе данных:<br>'+
   esc(e.message)+'</div>';
 }
}

function normalizeUser(u){
 return {
  ...u,
  id:Number(u.id),
  balance:Number(u.balance||0),
  role:
   u.nickname?.toLowerCase()===OWNER
   ?'Основатель'
   :(u.role||'Игрок')
 };
}

function roleLevel(u=currentUser){
 if(!u)return 0;
 if(u.is_owner||u.nickname?.toLowerCase()===OWNER)return 7;
 return ROLE_LEVEL[u.role]||0;
}

function canAdmin(){
 return roleLevel()>=1;
}

function canManageProject(){
 return roleLevel()>=3;
}

function canBan(){
 return roleLevel()>=4;
}

function canRoles(){
 return roleLevel()>=5;
}

function logout(){
 localStorage.removeItem('dpy_session');
 currentUser=null;
 document.getElementById('appView').classList.add('hidden');
 document.getElementById('authView').classList.remove('hidden');
 renderAuth();
}

/* =========================
   PLATE GENERATOR
========================= */

function randomLetter(){
 return LETTERS[Math.floor(Math.random()*LETTERS.length)];
}

function randomDigit(){
 return Math.floor(Math.random()*10);
}

function makePlate(){

 let a=randomLetter();
 let b=randomLetter();
 let c=randomLetter();

 let n=
  randomDigit()+
  ''+randomDigit()+
  randomDigit();

 let region=
  String(Math.floor(Math.random()*999)+1)
  .padStart(3,'0');

 /*
  Запрещаем невалидные комбинации
 */
 if(n==='000')
  n='001';

 return a+n+b+c+' '+region;
}

function rarityForPlate(plate){

 const clean=plate.replace(/\s/g,'');

 if(
  /(\d)\1\1/.test(clean)||
  clean.includes('777')||
  clean.includes('888')||
  clean.includes('999')
 )
  return 'legendary';

 if(
  /(\d)(\d)\1/.test(clean)||
  clean.includes('001')||
  clean.includes('007')
 )
  return 'epic';

 if(
  clean.includes('123')||
  clean.includes('321')||
  clean.includes('555')
 )
  return 'rare';

 return 'common';
}

/*
  Нельзя использовать await внутри map template.
  Поэтому имя продавца в реальном DOM
  дополнительно подтягивается после рендера.
*/
function awaitName(id){
 return 'ID '+id;
}

async function buyMarket(id){

 try{

  const m=(await select(
   'market',
   'id=eq.'+id+'&select=*'
  ))?.[0];

  if(!m){
   alert('Номер уже куплен.');
   return;
  }

  if(Number(m.seller_id)===Number(currentUser.id)){
   alert('Нельзя купить собственный номер.');
   return;
  }

  const price=Number(m.price||0);

  if(Number(currentUser.balance)<price){
   alert('Недостаточно средств.');
   return;
  }

  const seller=(await select(
   'users',
   'id=eq.'+m.seller_id+'&select=*'
  ))?.[0];

  if(!seller){
   alert('Продавец не найден.');
   return;
  }

  const exists=await select(
   'plates',
   'user_id=eq.'+currentUser.id+
   '&plate=eq.'+encodeURIComponent(m.plate)+
   '&select=id'
  );

  if(exists?.length){
   alert('Этот номер уже есть у вас.');
   return;
  }

  await update(
   'users',
   'id=eq.'+currentUser.id,
   {
    balance:Number(currentUser.balance)-price
   }
  );

  try{

   await update(
    'users',
    'id=eq.'+seller.id,
    {
     balance:Number(seller.balance||0)+price
    }
   );

   await insert('plates',{
    user_id:currentUser.id,
    plate:m.plate,
    region:m.region||'000',
    rarity:m.rarity||'common',
    price:price
   });

   await remove(
    'market',
    'id=eq.'+id
   );

  }catch(e){

   await update(
    'users',
    'id=eq.'+currentUser.id,
    {
     balance:Number(currentUser.balance)
    }
   );

   throw e;
  }

  await addMessage(
   currentUser.id,
   'Покупка номера',
   'Вы купили номер: '+m.plate+
   '\\nСтоимость: '+price+
   '\\nПродавец: '+seller.nickname+
   '\\nАдминистратор: система'
  );

  await addMessage(
   seller.id,
   'Продажа номера',
   'Ваш номер '+m.plate+
   ' продан пользователю '+currentUser.nickname+
   ' за '+price+
   '.\\nАдминистратор: система'
  );

  currentUser.balance-=price;

  alert('Номер '+m.plate+' куплен!');

  await renderPage();

 }catch(e){

  console.error(e);
  alert('Ошибка покупки: '+e.message);
 }
}

function promoCode(){

 const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

 function part(){
  let s='';
  for(let i=0;i<3;i++)
   s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
 }

 return 'D0NTYYY-'+part()+'-'+part();
}

async function generatePromo(){

 const type=document.getElementById('promoType').value;
 const reward=document.getElementById('promoReward').value.trim();
 const uses=Number(document.getElementById('promoUses').value);

 if(!reward||uses<1){
  alert('Заполни данные.');
  return;
 }

 let data={
  code:promoCode(),
  amount:type==='money'?Number(reward):0,
  used:false,
  one_time:uses===1
 };

 /*
  Если у тебя уже добавлены поля reward_type/plate,
  они сохраняются. Если миграция ещё не выполнена,
  основные поля всё равно создаются.
 */
 data.reward_type=type;

 if(type==='plate'){
  data.plate=reward;
 }

 try{

  const result=await insert('promocodes',data);

  const p=result[0];

  alert(
   'Промокод создан:\\n\\n'+
   p.code+
   '\\nАктиваций: '+uses
  );

  loadPromos();

 }catch(e){

  /*
   Если старые колонки отсутствуют,
   повторяем с базовыми полями.
  */
  if(type==='money'){

   const result=await insert('promocodes',{
    code:data.code,
    amount:Number(reward),
    used:false,
    one_time:uses===1
   });

   alert(
    'Промокод создан:\\n\\n'+
    result[0].code
   );

  }else{

   alert(
    'Для промокодов с номерами нужны поля '+
    'reward_type и plate в таблице promocodes.'
   );
  }

  loadPromos();
 }
}

 const duration=document.getElementById('punDuration').value.trim();

 const target=(await select(

  'id=eq.'+uid+'&select=*'
 ))?.[0];

 if(!target)return;

 await insert('punishments',{
  user_id:uid,
  type,
  reason:reason+' | Срок: '+duration,
  status:'Активно',
  issued_by:currentUser.nickname
 });

 if(type==='ban'){

  await update(
   'users',
   'id=eq.'+uid,
   {banned:true}
  );
 }

 if(type==='remove_admin'){

  await update(
   'users',
   'id=eq.'+uid,
   {
    role:'Игрок',
    is_admin:false,
    is_owner:false
   }
  );
 }

 await addMessage(
  uid,
  'Вам выдано наказание',
  'Тип: '+type+
  '\\nПричина: '+reason+
  '\\nСрок: '+duration+
  '\\nАдминистратор: '+currentUser.nickname
 );

 alert('Наказание выдано.');
 renderAdmin();
}

/* =========================
   SEARCH
========================= */

function adminSearch(c){

 c.innerHTML=`
  <div class="section-title">ПОИСК ПОЛЬЗОВАТЕЛЯ</div>

  <div class="card" style="margin-top:15px">

   <div class="field">
    <label>НИКНЕЙМ ИЛИ ТРЁХЗНАЧНЫЙ ID</label>
    <input id="searchUser"
     placeholder="d0ntyyy или 123">
   </div>

   <button class="btn btn-blue"
    onclick="searchUserAdmin()">
    НАЙТИ
   </button>

  </div>

  <div id="searchResult" style="margin-top:15px"></div>
 `;
}

async function searchUserAdmin(){

 const q=document.getElementById('searchUser').value.trim();

 if(!q)return;

 let rows;

 if(/^\\d{1,3}$/.test(q)){

  rows=await select(
   'users',
   'id=eq.'+Number(q)+'&select=*'
  );

 }else{

  rows=await select(
   'users',
   'nickname=eq.'+encodeURIComponent(q)+'&select=*'
  );
 }

 const box=document.getElementById('searchResult');

 if(!rows?.length){
  box.innerHTML='<div class="card">Пользователь не найден.</div>';
  return;
 }

 const u=rows[0];

 const punish=await select(
  'punishments',
  'user_id=eq.'+u.id+'&select=*&order=created_at.desc'
 );

 const tags=await select(
  'tags',
  'user_id=eq.'+u.id+'&select=*'
 );

 const plates=await select(
  'plates',
  'user_id=eq.'+u.id+'&select=*'
 );

 const allUsers=await select(
  'users',
  'select=id,nickname,balance&order=balance.desc'
 );

 const place=
  (allUsers||[]).findIndex(x=>Number(x.id)===Number(u.id))+1;

 box.innerHTML=`

 <div class="card">

  <div class="section-title">
   ${esc(u.nickname)}
  </div>

  <div class="grid" style="margin-top:15px">

   <div class="notice">
    <div class="muted small">ID</div>
    <b>${u.id}</b>
   </div>

   <div class="notice">
    <div class="muted small">ЗАРЕГИСТРИРОВАН</div>
    <b>${fmt(u.created_at)}</b>
   </div>

   <div class="notice">
    <div class="muted small">РОЛЬ</div>
    <b>${esc(u.role||'Игрок')}</b>
   </div>

   <div class="notice">
    <div class="muted small">БАЛАНС</div>
    <b>${Number(u.balance||0).toLocaleString('ru-RU')}</b>
   </div>

   <div class="notice">
    <div class="muted small">БАН</div>
    <b>${u.banned?'ДА':'НЕТ'}</b>
   </div>

   <div class="notice">
    <div class="muted small">МЕСТО В ТОПЕ</div>
    <b>${place>0?'#'+place:'—'}</b>
   </div>

  </div>

  <div class="section-title" style="margin-top:20px">
   ТЕГИ
  </div>

  <div class="actions" style="margin-top:10px">
   ${
    tags?.length
    ?
    tags.map(t=>
     `<span class="badge"
      style="color:${esc(t.color||'#ff3030')};
      border-color:${esc(t.color||'#ff3030')}">
      ${esc(t.tag)}
     </span>`
    ).join('')
    :
    '<span class="muted">Нет тегов.</span>'
   }
  </div>

  <div class="section-title" style="margin-top:20px">
   НОМЕРА
  </div>

  ${
   plates?.length
   ?
   plates.map(p=>`
    <div class="row">
     ${esc(p.plate)}
     <span class="badge ${
      p.active===false?'red':'green'
     }">
      ${p.active===false?'ДЕАКТИВИРОВАН':'АКТИВЕН'}
     </span>
    </div>
   `).join('')
   :
   '<div class="muted">Номеров нет.</div>'
  }

  <div class="section-title" style="margin-top:20px">
   НАРУШЕНИЯ
  </div>

  ${
   punish?.length
   ?
   punish.map(p=>`
    <div class="row">
     <b>${esc(p.type)}</b>
     <div>${esc(p.reason)}</div>
     <div class="muted small">
      Выдал: ${esc(p.issued_by||'—')}
      · ${fmt(p.created_at)}
     </div>
    </div>
   `).join('')
   :
   '<div class="muted">Нарушений нет.</div>'
  }

 </div>
 `;
}

========================= */

async function boot(){

 renderAuth();

 try{

  const sid=localStorage.getItem('dpy_session');

  if(sid){

   const rows=await select(
    'users',
    'id=eq.'+Number(sid)+'&select=*'
   );

   if(rows?.[0]&&!rows[0].banned){

    currentUser=normalizeUser(rows[0]);

    await openApp();

    return;
   }
  }

 }catch(e){
  console.error(e);
 }
}

boot();

</script>
